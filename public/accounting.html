<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Contabilidad</title>
	<link rel="stylesheet" href="/styles.css?v=2025-09-17-1" />
	<style>
		/* Oculta el ícono/calendario nativo del input de fecha para evitar duplicado */
		input[type="date"] { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
		input[type="date"]::-webkit-calendar-picker-indicator { display: none; }
		/* Mismo borde redondeado y fondo para los campos del formulario */
		.input-cell { border: 1px solid var(--border); background: var(--card); }
		/* Quitar flechas en input number (Valor) */
		input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
		input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
		/* Botón de adjunto por fila */
		.attach-btn { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border); background: transparent; color: var(--foreground); font-weight: 700; line-height: 1; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
		.attach-btn.has { background: #ad1457; color: #fff; border-color: #ad1457; }
		/* Celdas editables */
		.editable { 
			cursor: pointer; 
			transition: background-color 0.2s ease, transform 0.1s ease;
			padding: 4px 8px;
			border-radius: 4px;
		}
		.editable:hover {
			background-color: rgba(244, 166, 183, 0.15);
			transform: scale(1.02);
		}
		.editable:active {
			transform: scale(0.98);
		}
		/* Estilos para los botones de meses */
		.month-buttons {
			display: flex;
			gap: 8px;
			justify-content: center;
			flex-wrap: wrap;
			padding: 12px;
		}
		/* Efecto hover para el botón + de la tabla */
		#add-entry-btn-table:hover {
			transform: scale(1.1);
			box-shadow: 0 6px 24px rgba(244, 166, 183, 0.6) !important;
		}
		#add-entry-btn-table:active {
			transform: scale(0.95);
		}
		.month-btn {
			padding: 10px 18px;
			border: 1px solid var(--border);
			background: var(--card);
			color: var(--foreground);
			border-radius: 6px;
			cursor: pointer;
			font-size: 14px;
			font-weight: 500;
			transition: all 0.2s ease;
			min-width: 100px;
		}
		.month-btn:hover {
			background: var(--hover-primary-pink, #e27a90);
			color: white;
			transform: translateY(-2px);
			box-shadow: 0 4px 12px rgba(244, 166, 183, 0.3);
			border-color: var(--primary);
		}
		.month-btn:active {
			transform: translateY(0);
		}
		.month-btn.active {
			background: var(--primary, #f4a6b7);
			color: white;
			border-color: var(--primary);
			box-shadow: 0 4px 12px rgba(244, 166, 183, 0.2);
		}
		/* Estilos para el botón + y popover del formulario */
		.add-entry-btn {
			position: fixed;
			bottom: 30px;
			right: 30px;
			width: 60px;
			height: 60px;
			border-radius: 50%;
			background: var(--primary, #f4a6b7);
			color: white;
			border: none;
			font-size: 32px;
			font-weight: 900;
			cursor: pointer;
			box-shadow: 0 8px 24px rgba(244, 166, 183, 0.5);
			transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
			z-index: 100;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.add-entry-btn:hover {
			background: var(--hover-primary-pink, #e27a90);
			box-shadow: 0 10px 32px rgba(244, 166, 183, 0.6);
			transform: scale(1.1) rotate(90deg);
		}
		.add-entry-btn:active {
			transform: scale(0.9) rotate(90deg);
		}
		.form-popover {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			background: var(--card);
			border: 1px solid var(--border);
			border-radius: 24px;
			padding: 28px;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
			z-index: 1000;
			width: 420px;
			max-width: 92vw;
			max-height: 90vh;
			overflow-y: auto;
			animation: popUp 0.3s ease;
		}
		@keyframes popUp {
			from { opacity: 0; transform: translate(-50%, -40%) scale(0.95); }
			to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
		}
		.form-popover-backdrop {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(0, 0, 0, 0.6);
			backdrop-filter: blur(4px);
			z-index: 999;
		}
		.form-popover h3 {
			margin: 0 0 24px 0;
			text-align: center;
			font-size: 1.5rem;
			font-weight: 800;
			color: var(--foreground);
		}

		/* RESPONSIVE ADJUSTMENTS */
		@media (max-width: 600px) {
			.app-header { padding: 12px 16px; }
			.header-row { flex-direction: column; gap: 12px; align-items: stretch; }
			.header-left { justify-content: center; }
			.header-actions { justify-content: center; width: 100%; }
			.header-actions button { flex: 1; min-width: 0; padding: 10px; font-size: 0.85rem; }

			.panel-header { flex-direction: column; align-items: stretch; gap: 12px; }
			.panel-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
			.panel-actions button { width: 100%; margin: 0; padding: 12px 8px; font-size: 0.8rem; }

			#add-entry-btn-table { display: none; } /* Use floating button on mobile */
			.table-wrapper { 
				overflow-x: auto; 
				-webkit-overflow-scrolling: touch; 
				margin: 12px -16px; /* Bleed to edges */
				padding: 0 16px;
				width: calc(100% + 32px);
				border-radius: 0;
			}
			table th, table td { min-width: 100px; padding: 12px 8px; font-size: 0.85rem; }
			table th:first-child, table td:first-child { min-width: 40px; position: sticky; left: 0; background: var(--card); z-index: 2; border-right: 1px solid var(--border); }
			.col-total { text-align: right !important; min-width: 90px; }

			.form-popover { padding: 24px 20px; border-radius: 20px; }
			.form-popover form label { flex-direction: column; align-items: stretch !important; gap: 4px; }
			.form-popover form label span { min-width: unset !important; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }
			.month-btn { flex: 1; min-width: calc(33.33% - 8px); padding: 10px 8px; font-size: 0.8rem; }
			
			.month-buttons { justify-content: flex-start; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 8px; -webkit-overflow-scrolling: touch; }
			.month-buttons::-webkit-scrollbar { display: none; }
		}

		@media (max-width: 400px) {
			.month-btn { min-width: 100px; }
		}
	</style>
</head>
<body>
	<header class="app-header">
		<div class="header-row">
			<div class="header-left">
				<img src="/logo.png" alt="Lulitas Logo" class="app-logo" />
				<h1>Contabilidad</h1>
			</div>
			<div class="header-actions">
				<button id="back-btn" class="press-btn">Volver</button>
			</div>
		</div>
	</header>

	<main class="sales-panel">
			<div class="panel-header">
			<h3>Contabilidad</h3>
			<div class="panel-actions">
					<button id="download-range" class="press-btn">Descargar adjuntos</button>
					<button id="change-range" class="press-btn">Cambiar fechas</button>
			</div>
		</div>
		<div class="panel-body">
			<div style="position:relative; margin:12px 12px 16px 12px;">
				<div class="month-buttons" id="month-buttons" style="margin:0; padding:12px; justify-content:center;">
					<!-- Los botones de meses se generarán dinámicamente -->
				</div>
				<button id="add-entry-btn-table" class="press-btn btn-primary" style="position:absolute; right:0; top:50%; transform:translateY(-50%); width:50px; height:50px; border-radius:50%; padding:0; font-size:180px; font-weight:900; line-height:0.5; display:flex; align-items:center; justify-content:center; box-shadow: 0 4px 16px rgba(244, 166, 183, 0.4); transition: all 0.3s ease; overflow:hidden;" title="Nueva entrada">+</button>
			</div>
			<div style="display:flex; justify-content:space-between; align-items:center; margin:0 12px 8px 12px">
				<strong id="range-label"></strong>
				<small id="count-label" style="opacity:.8"></small>
			</div>
					<div class="table-wrapper" id="acc-wrapper" style="margin-top:12px;">
				<table id="acc-table">
					<thead>
						<tr>
							<th></th>
									<th>Fecha</th>
									<th>Descripción</th>
									<th class="col-total">Ingreso</th>
									<th class="col-total">Salida</th>
									<th class="col-total">Saldo</th>
							<th></th>
							<th></th>
							<th></th>
						</tr>
					</thead>
						<tbody id="acc-tbody"></tbody>
						<tfoot>
								<tr><td colspan="8" style="height:30px; border-bottom:none; background:transparent;"></td></tr>
								<tr>
									<td></td>
									<td></td>
									<td class="label">Ingresos</td>
									<td class="col-total" id="t-ingresos"></td>
									<td></td>
									<td></td>
									<td></td>
									<td></td>
								</tr>
								<tr>
									<td></td>
									<td></td>
									<td class="label">Salidas</td>
									<td></td>
									<td class="col-total" id="t-gastos"></td>
									<td></td>
									<td></td>
									<td></td>
								</tr>
								<tr>
									<td></td>
									<td></td>
									<td class="label">Saldo</td>
									<td></td>
									<td></td>
									<td class="col-total" id="t-balance" style="color: var(--accent); font-weight: 700;"></td>
									<td></td>
									<td></td>
								</tr>
						</tfoot>
				</table>
			</div>
		</div>
	</main>

	<!-- Botón flotante para agregar entrada -->
	<button id="add-entry-btn" class="add-entry-btn" title="Nueva entrada">+</button>

	<script type="module">
	(function(){
		// Gate: only superadmin
		let currentUser = null;
		try { const saved = localStorage.getItem('authUser'); if (saved) currentUser = JSON.parse(saved); } catch {}
		const isSuper = currentUser && (currentUser.role === 'superadmin' || !!currentUser.isSuperAdmin);
		if (!isSuper) { alert('Solo el superadministrador'); location.href = '/'; return; }

		const today = new Date();
		const rangeLabel = document.getElementById('range-label');
		const countLabel = document.getElementById('count-label');
		const tbody = document.getElementById('acc-tbody');
		const tIng = document.getElementById('t-ingresos');
		const tGas = document.getElementById('t-gastos');
		const tBal = document.getElementById('t-balance');
		const changeBtn = document.getElementById('change-range');
		const downloadBtn = document.getElementById('download-range');
		const addEntryBtn = document.getElementById('add-entry-btn');
		let currentKind = 'ingreso';
		let formPopover = null;
		let currentFileBase64 = null;
		let currentFileName = null;
		let currentFileType = null;

		// Utility to compress images before upload
		async function compressImage(file, options = { maxWidth: 800, maxHeight: 800, quality: 0.75 }) {
			return new Promise((resolve) => {
				const reader = new FileReader();
				reader.onload = (e) => {
					const img = new Image();
					img.onload = () => {
						const canvas = document.createElement('canvas');
						let width = img.width;
						let height = img.height;
						if (width > options.maxWidth) {
							height *= options.maxWidth / width;
							width = options.maxWidth;
						}
						if (height > options.maxHeight) {
							width *= options.maxHeight / height;
							height = options.maxHeight;
						}
						canvas.width = width;
						canvas.height = height;
						const ctx = canvas.getContext('2d');
						ctx.drawImage(img, 0, 0, width, height);
						resolve(canvas.toDataURL('image/jpeg', options.quality));
					};
					img.src = e.target.result;
				};
				reader.readAsDataURL(file);
			});
		}

		function setKind(kind, btnIngreso, btnSalida){
			currentKind = kind === 'salida' ? 'gasto' : 'ingreso';
			const isIngreso = currentKind === 'ingreso';
			btnIngreso.setAttribute('aria-pressed', isIngreso ? 'true' : 'false');
			btnSalida.setAttribute('aria-pressed', isIngreso ? 'false' : 'true');
			// Selected retains hover appearance permanently
			const activeStyles = (el, active) => {
				if (active) {
					el.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--hover-primary-pink') || '#e27a90';
					el.style.boxShadow = '0 8px 24px var(--hover-shadow-pink)';
				} else {
					el.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--primary') || '#f4a6b7';
					el.style.boxShadow = '';
				}
			};
			activeStyles(btnIngreso, isIngreso);
			activeStyles(btnSalida, !isIngreso);
		}

		function formatDay(diso){ if (!diso) return ''; const d=new Date(diso+'T00:00:00Z'); const m=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']; return `${d.getUTCDate()} ${m[d.getUTCMonth()]} ${d.getUTCFullYear()}`; }

		// Range: current month by default
		let start = new Date(Date.UTC(today.getFullYear(), today.getMonth(), 1)).toISOString().slice(0,10);
		let end = new Date(Date.UTC(today.getFullYear(), today.getMonth()+1, 0)).toISOString().slice(0,10);

		// Generate last 6 months buttons
		const monthButtons = document.getElementById('month-buttons');
		const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
		
		function generateMonthButtons() {
			monthButtons.innerHTML = '';
			// Use same date logic as the rest of the code
			const currentYear = today.getFullYear();
			const currentMonth = today.getMonth();
			const months = [];
			
			// Generate last 6 months including current month
			for (let i = 5; i >= 0; i--) {
				const date = new Date(currentYear, currentMonth - i, 1);
				const monthStart = new Date(Date.UTC(date.getFullYear(), date.getMonth(), 1)).toISOString().slice(0,10);
				const monthEnd = new Date(Date.UTC(date.getFullYear(), date.getMonth() + 1, 0)).toISOString().slice(0,10);
				
				months.push({
					name: monthNames[date.getMonth()],
					year: date.getFullYear(),
					start: monthStart,
					end: monthEnd,
					isCurrent: i === 0
				});
			}
			
			// Create buttons
			months.forEach((month, index) => {
				const btn = document.createElement('button');
				btn.className = 'month-btn';
				btn.textContent = month.name;
				btn.dataset.start = month.start;
				btn.dataset.end = month.end;
				
				// Mark current month as active by default
				if (month.isCurrent) {
					btn.classList.add('active');
				}
				
				// Click handler
				btn.addEventListener('click', () => {
					// Remove active class from all buttons
					monthButtons.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
					// Add active class to clicked button
					btn.classList.add('active');
					// Update range and reload data
					start = month.start;
					end = month.end;
					load();
				});
				
				monthButtons.appendChild(btn);
			});
		}
		
		// Initialize month buttons
		generateMonthButtons();

		async function fetchJSON(u, opts){ const r = await fetch(u, opts); if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }
		function fmtMoney(n){ const v = Number(n||0); try { return new Intl.NumberFormat('es-CO').format(v); } catch { return String(v); } }

		function selectAllContent(el) {
			try {
				if (!el) return;
				const range = document.createRange();
				range.selectNodeContents(el);
				const sel = window.getSelection();
				sel.removeAllRanges();
				sel.addRange(range);
			} catch { }
		}

		function renderRows(rows){
			tbody.innerHTML = '';
			let sumIng = 0, sumGas = 0, running = 0;
			for (const r of (rows||[])){
				const tr = document.createElement('tr');
				const v = Number(r.amount_cents||0);
				const isIng = (r.kind||'') === 'ingreso';
				if (isIng) { sumIng += v; running += v; } else { sumGas += v; running -= v; }
				const colIng = isIng ? String(v) : '';
				const colSal = !isIng ? String(v) : '';
				const hasAtt = !!(r.has_attachment);
				tr.innerHTML = `
					<td style="text-align:center; width:28px"><button class="attach-btn${hasAtt ? ' has' : ''}" data-id="${r.id}" title="Adjuntar archivo" aria-label="Adjuntar">${hasAtt ? '●' : '-'}</button></td>
					<td class="editable" data-field="entry_date" title="Clic para editar fecha">${String(r.entry_date||'').slice(0,10)}</td>
					<td class="editable" data-field="description" contenteditable="true" title="Clic para editar descripción">${r.description||''}</td>
					<td class="col-total editable" data-field="amount_cents" data-kind="ingreso" contenteditable="true" title="Clic para editar">${colIng}</td>
					<td class="col-total editable" data-field="amount_cents" data-kind="gasto" contenteditable="true" title="Clic para editar">${colSal}</td>
					<td class="col-total">${fmtMoney(running)}</td>
				<td style="padding-right:2px;"><button class="row-duplicate" data-dup="${r.id}" title="Duplicar" aria-label="Duplicar"></button></td>
				<td style="padding-left:2px;"><button class="row-delete" data-del="${r.id}" title="Eliminar" aria-label="Eliminar"></button></td>
				`;
				tbody.appendChild(tr);

				// Wire attachment upload or view
				const attBtn = tr.querySelector('.attach-btn');
				attBtn.addEventListener('click', async () => {
					// ... same as before ...
					if (attBtn.classList.contains('has')) { /* ... view ... */ } else { /* ... upload ... */ }
				});

				const tds = tr.querySelectorAll('td');
				const tdDate = tds[1];
				const tdDesc = tds[2];
				const tdIng = tds[3];
				const tdSal = tds[4];

				// Setup Select All on focus/click
				[tdDesc, tdIng, tdSal].forEach(el => {
					el.addEventListener('focus', () => setTimeout(() => {
						if (!el._isClicked) selectAllContent(el);
					}, 10));
					el.addEventListener('mousedown', () => {
						el._alreadyFocused = (document.activeElement === el);
					});
					el.addEventListener('click', () => {
						if (!el._alreadyFocused) selectAllContent(el);
						el._isClicked = true;
						setTimeout(() => el._isClicked = false, 200);
					});
					el.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); el.blur(); } });
				});

				// Date Picker remains popover as requested
				tdDate.addEventListener('click', (ev) => {
					openSingleDatePopover(async (pickedIso) => {
						try { 
							const res = await fetch('/api/accounting', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Actor-Name': currentUser?.name || '' }, body: JSON.stringify({ id: r.id, entry_date: pickedIso }) });
							if (res.ok) await load();
						} catch (e) { }
					}, ev.clientX, ev.clientY);
				});

				// Description Auto-save
				tdDesc.addEventListener('blur', async () => {
					const newVal = tdDesc.textContent.trim();
					if (newVal === r.description) return;
					try {
						await fetch('/api/accounting', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Actor-Name': currentUser?.name || '' }, body: JSON.stringify({ id: r.id, description: newVal }) });
						await load();
					} catch (e) { }
				});

				// Numeric Logic (Sanitization + Save)
				[tdIng, tdSal].forEach(el => {
					el.addEventListener('input', () => {
						const current = el.textContent || '';
						let sanitized = current.replace(/[^0-9]/g, '');
						if (sanitized.length > 1) sanitized = sanitized.replace(/^0+/, '');
						if (current !== sanitized) el.textContent = sanitized;
					});

					el.addEventListener('blur', async () => {
						const val = parseInt(el.textContent.trim(), 10) || 0;
						const kind = el.getAttribute('data-kind');
						const oldVal = (r.kind === kind) ? r.amount_cents : 0;
						
						// If nothing changed or value is 0 on the "wrong" column, do nothing
						if (val === oldVal) {
							// Reset view if user typed 0 on empty column
							if (val === 0 && r.kind !== kind) el.textContent = '';
							// Reset formatting if same
							else if (val > 0) el.textContent = String(val);
							return;
						}

						try {
							const payload = { id: r.id, amount_cents: val };
							// Switch kind if user typed in the other column
							if (val > 0 && r.kind !== kind) payload.kind = kind;
							
							const res = await fetch('/api/accounting', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Actor-Name': currentUser?.name || '' }, body: JSON.stringify(payload) });
							if (res.ok) await load();
							else await load(); // reload to reset view on error
						} catch (e) { await load(); }
					});
				});
			}
			tIng.textContent = fmtMoney(sumIng || 0);
			tGas.textContent = fmtMoney(sumGas || 0);
			tBal.textContent = fmtMoney((sumIng - sumGas) || 0);
			countLabel.textContent = `Filas: ${(rows||[]).length}`;

			// Wire deletes
			Array.from(tbody.querySelectorAll('button[data-del]')).forEach(btn => {
				btn.addEventListener('click', async () => {
					const id = Number(btn.getAttribute('data-del'));
					if (!id) return;
					if (!confirm('Eliminar registro?')) return;
					try { await fetch(`/api/accounting?id=${encodeURIComponent(id)}`, { method: 'DELETE', headers: { 'X-Actor-Name': currentUser?.name || '' } }); await load(); } catch {}
				});
			});
			// Wire duplicates
			Array.from(tbody.querySelectorAll('button[data-dup]')).forEach(btn => {
				btn.addEventListener('click', async () => {
					const id = Number(btn.getAttribute('data-dup'));
					if (!id) return;
					const row = rows.find(r => r.id === id);
					if (!row) return;
					try {
						const payload = { 
							kind: row.kind, 
							entry_date: row.entry_date, 
							description: row.description, 
							amount_cents: row.amount_cents, 
							_actor_name: currentUser?.name || '' 
						};
						const res = await fetch('/api/accounting', { 
							method: 'POST', 
							headers: { 'Content-Type': 'application/json', 'X-Actor-Name': currentUser?.name || '' }, 
							body: JSON.stringify(payload) 
						});
						if (!res.ok) {
							let msg = `Error (${res.status})`;
							try { const j = await res.json(); if (j && j.error) msg = j.error; } catch {}
							alert(msg);
							return;
						}
						await load();
					} catch (e) {
						console.error(e);
						alert('Error al duplicar');
					}
				});
			});
		}

		function openFormPopover() {
			if (formPopover) return; // Already open

			// Create backdrop
			const backdrop = document.createElement('div');
			backdrop.className = 'form-popover-backdrop';

			// Create popover
			const popover = document.createElement('div');
			popover.className = 'form-popover';

			// Create form content
			popover.innerHTML = `
				<h3>Nuevo Registro</h3>
				<form id="acc-form" style="display:flex; flex-direction:column; gap:16px;">
					<div style="display:flex; gap:12px; justify-content:center;">
						<button id="btn-ingreso" type="button" class="press-btn btn-primary" aria-pressed="true" style="flex:1; padding:12px 20px; font-size:15px; border-radius:8px;">Ingreso</button>
						<button id="btn-salida" type="button" class="press-btn btn-primary" aria-pressed="false" style="flex:1; padding:12px 20px; font-size:15px; border-radius:8px;">Salida</button>
					</div>
					<label style="display:flex; gap:8px; align-items:center;">
						<span style="min-width:92px;">Fecha</span>
						<div style="position:relative; flex:1;">
							<input id="acc-date" type="date" class="input-cell" required style="width:100%; padding-right:42px;" />
							<button id="acc-date-icon" type="button" title="Calendario" aria-label="Abrir calendario" style="position:absolute; right:4px; top:50%; transform: translateY(-50%); padding:6px 8px; border:none; background:transparent; box-shadow:none;">📅</button>
						</div>
					</label>
					<label style="display:flex; gap:8px; align-items:center;">
						<span style="min-width:92px;">Descripción</span>
						<input id="acc-desc" type="text" class="input-cell" placeholder="Descripción" required style="flex:1;" />
					</label>
					<label style="display:flex; gap:8px; align-items:center;">
						<span style="min-width:92px;">Valor</span>
						<input id="acc-value" type="number" inputmode="numeric" class="input-cell" placeholder="0" required style="flex:1;" />
					</label>
					<div style="display:flex; gap:12px; align-items:center; border: 1px dashed var(--border); border-radius:8px; padding:12px; background:rgba(0,0,0,0.02);">
						<button id="acc-photo-trigger" type="button" class="press-btn" style="padding:8px; display:flex; align-items:center; gap:6px; font-size:14px; white-space:nowrap;">📷 Foto Recibo/Factura</button>
						<span id="acc-photo-status" style="font-size:12px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Sin archivo</span>
						<input id="acc-file" type="file" accept="image/*" style="display:none" />
					</div>
					<div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px;">
						<button id="acc-cancel" type="button" class="press-btn">Cancelar</button>
						<button id="acc-save" type="submit" class="press-btn btn-primary">Guardar</button>
					</div>
				</form>
			`;

			const form = popover.querySelector('#acc-form');
			const dateInput = popover.querySelector('#acc-date');
			const dateIconBtn = popover.querySelector('#acc-date-icon');
			const btnIngreso = popover.querySelector('#btn-ingreso');
			const btnSalida = popover.querySelector('#btn-salida');
			const cancelBtn = popover.querySelector('#acc-cancel');

			// Set default date
			const today = new Date();
			const iso = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate())).toISOString().slice(0,10);

			btnIngreso.addEventListener('click', () => setKind('ingreso', btnIngreso, btnSalida));
			btnSalida.addEventListener('click', () => setKind('salida', btnIngreso, btnSalida));

			// File upload logic for new record
			const photoTrigger = popover.querySelector('#acc-photo-trigger');
			const photoStatus = popover.querySelector('#acc-photo-status');
			const fileInput = popover.querySelector('#acc-file');
			
			currentFileBase64 = null;
			currentFileName = null;
			currentFileType = null;

			photoTrigger.addEventListener('click', () => fileInput.click());
			fileInput.addEventListener('change', async () => {
				if (!fileInput.files || !fileInput.files[0]) return;
				const file = fileInput.files[0];
				photoStatus.textContent = "Comprimiendo...";
				photoTrigger.disabled = true;
				try {
					currentFileBase64 = await compressImage(file);
					currentFileName = file.name;
					currentFileType = 'image/jpeg';
					photoStatus.textContent = `✅ ${file.name}`;
					photoStatus.style.color = "var(--success)";
				} catch (e) {
					console.error(e);
					photoStatus.textContent = "Error al procesar foto";
					photoStatus.style.color = "var(--danger)";

					photoTrigger.disabled = false;
				}
			});

			setKind('salida', btnIngreso, btnSalida);

			});

				ev.preventDefault();
				openSingleDatePopover((pickedIso) => { dateInput.value = pickedIso; }, ev.clientX, ev.clientY);
			});

			// Form submission
			form.addEventListener('submit', async (e) => {
				e.preventDefault();
				const type = currentKind;
				const date = (popover.querySelector('#acc-date').value || '').toString();
				const desc = (popover.querySelector('#acc-desc').value || '').toString();
				const value = Number(popover.querySelector('#acc-value').value || 0);
				if (!date || !desc || !value) { alert('Completa todos los campos'); return; }
				try {
					const payload = { kind: type, entry_date: date, description: desc, amount_cents: Number.isFinite(value) ? Math.round(value) : 0, _actor_name: currentUser?.name || '' };

						let msg = `Error (${res.status})`;
						try { const j = await res.json(); if (j && j.error) msg = j.error; } catch {}
						alert(msg);
						return;
					}
					const newEntry = await res.json();

					if (currentFileBase64 && newEntry && newEntry.id) {

					await load();

					console.error(err);
					alert('Error al guardar');
				}

			function closeFormPopover() {

					document.body.removeChild(formPopover.backdrop);
					document.body.removeChild(formPopover.popover);
					formPopover = null;
				}
			}

			cancelBtn.addEventListener('click', closeFormPopover);
			backdrop.addEventListener('click', closeFormPopover);

			// ESC key to close
			function onKeyDown(e) {
				if (e.key === 'Escape') {
					closeFormPopover();
					document.removeEventListener('keydown', onKeyDown);
				}
			}
			document.addEventListener('keydown', onKeyDown);
		}

			try {
				rangeLabel.textContent = `${formatDay(start)} — ${formatDay(end)}`;
				countLabel.textContent = 'Cargando…';
				const rows = await fetchJSON(`/api/accounting?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`);
				renderRows(rows);
			} catch (e) {
				countLabel.textContent = 'Error cargando';
			}
		}

		document.getElementById('back-btn').addEventListener('click', () => { location.href = '/'; });
		
		// Open form popover on + button click
		addEntryBtn.addEventListener('click', openFormPopover);

		function openCalendar(ev){
			openRangeCalendarPopover((range) => {
				if (!range || !range.start || !range.end) return;
				start = range.start; end = range.end;
				load();
			}, ev.clientX, ev.clientY, { preferUp: true });
		}
		changeBtn.addEventListener('click', openCalendar);

		// Descargar todos los adjuntos del rango seleccionado como archivos individuales (o ZIP si es posible)
		downloadBtn.addEventListener('click', async () => {
			try {
				const list = await fetchJSON(`/api/accounting?attachments_for_range=1&start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`);
				if (!Array.isArray(list) || !list.length) { alert('No hay adjuntos en el rango'); return; }
				// Intento simple: disparar descargas una por una con nombres
				for (const a of list) {
					const name = a.file_name || `adjunto_${String(a.entry_id)}_${String(a.id)}.bin`;
					const link = document.createElement('a'); link.href = a.file_base64; link.download = name; document.body.appendChild(link); link.click(); link.remove();
				}
			} catch (e) { console.error(e); alert('Error al descargar adjuntos'); }
		});

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_pro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="g_trophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#bg_pro)"/>

  <!-- Podium / Stairs -->
  <g transform="translate(45, 65)">
    <rect x="0" y="35" width="45" height="40" fill="#94a3b8"/>
    <text x="22.5" y="60" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">3</text>

    <rect x="45" y="5" width="55" height="70" fill="#f59e0b"/>
    <text x="72.5" y="45" font-family="sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>

    <rect x="100" y="20" width="45" height="55" fill="#cbd5e1"/>
    <text x="122.5" y="52" font-family="sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>
  </g>

  <!-- Trophy on 1st place -->
  <g transform="translate(100, 12)">
    <path d="M 8 10 L 26 10 L 26 28 C 26 38 8 38 8 28 Z" fill="url(#g_trophy)" stroke="#ca8a04" stroke-width="1.5"/>
    <!-- Handles -->
    <path d="M 8 15 C 0 15 0 25 8 25" fill="none" stroke="#ca8a04" stroke-width="2"/>
    <path d="M 26 15 C 34 15 34 25 26 25" fill="none" stroke="#ca8a04" stroke-width="2"/>
    <!-- Base -->
    <rect x="14" y="38" width="6" height="8" fill="#ca8a04"/>
    <rect x="10" y="46" width="14" height="6" rx="1" fill="#713f12"/>
    <!-- Star -->
    <text x="17" y="26" font-family="sans-serif" font-size="10" font-weight="900" fill="#713f12" text-anchor="middle">★</text>
  </g>

  <!-- Right: Briefcase & Badge -->
  <g transform="translate(210, 45)">
    <rect x="10" y="20" width="65" height="45" rx="5" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <path d="M 30 20 L 30 12 L 55 12 L 55 20" fill="none" stroke="#0f172a" stroke-width="3"/>
    <rect x="36" y="26" width="13" height="8" rx="1" fill="#facc15"/>
    <circle cx="68" cy="22" r="14" fill="#ef4444"/>
    <text x="68" y="27" font-family="sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">▲</text>
  </g>
</svg>
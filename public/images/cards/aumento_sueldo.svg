<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_raise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#bg_raise)"/>

  <!-- Ascending Bars -->
  <g transform="translate(70, 45)">
    <rect x="0" y="55" width="28" height="35" rx="3" fill="#86efac"/>
    <rect x="36" y="35" width="28" height="55" rx="3" fill="#4ade80"/>
    <rect x="72" y="15" width="28" height="75" rx="3" fill="#22c55e"/>
    <rect x="108" y="0" width="32" height="90" rx="4" fill="#16a34a"/>
    
    <!-- Big arrow up -->
    <path d="M 124 -15 L 140 2 L 132 2 L 132 18 L 116 18 L 116 2 L 108 2 Z" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="124" y="50" font-family="sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">+%</text>
  </g>

  <!-- Trophy on top -->
  <g transform="translate(230, 40)">
    <circle cx="25" cy="25" r="22" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
    <text x="25" y="32" font-family="sans-serif" font-size="20" font-weight="900" fill="#713f12" text-anchor="middle">📈</text>
  </g>
</svg>
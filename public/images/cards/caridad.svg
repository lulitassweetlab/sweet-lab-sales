<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cha" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#bg_cha)"/>

  <!-- Big Glowing Heart -->
  <g transform="translate(125, 25)">
    <path d="M 35 15 C 20 -10 -15 15 35 60 C 85 15 50 -10 35 15 Z" fill="#ec4899"/>
    <!-- Sparkles -->
    <circle cx="35" cy="28" r="4" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Donation Box -->
  <g transform="translate(115, 85)">
    <rect x="0" y="0" width="90" height="50" rx="4" fill="#a855f7" stroke="#7e22ce" stroke-width="2"/>
    <!-- Slot -->
    <rect x="25" y="4" width="40" height="6" rx="2" fill="#581c87"/>
    <!-- Handshake / Heart icon -->
    <circle cx="45" cy="28" r="14" fill="#ffffff"/>
    <text x="45" y="34" font-family="sans-serif" font-size="14" font-weight="900" fill="#a855f7" text-anchor="middle">♥</text>
  </g>

  <!-- Hands on the sides -->
  <g transform="translate(45, 75)">
    <path d="M 0 30 C 25 15 45 35 65 30" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g transform="translate(210, 75)">
    <path d="M 65 30 C 40 15 20 35 0 30" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
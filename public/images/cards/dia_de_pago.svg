<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_pay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="g_money" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#bg_pay)"/>

  <!-- Confetti / sparkles -->
  <circle cx="40" cy="30" r="3" fill="#f59e0b"/>
  <circle cx="70" cy="18" r="4" fill="#3b82f6"/>
  <circle cx="260" cy="25" r="3.5" fill="#ec4899"/>
  <circle cx="285" cy="45" r="3" fill="#10b981"/>
  <rect x="50" y="45" width="4" height="8" rx="1" transform="rotate(25 50 45)" fill="#8b5cf6"/>
  <rect x="240" y="50" width="4" height="8" rx="1" transform="rotate(-30 240 50)" fill="#f59e0b"/>

  <!-- Calendar Page -->
  <g transform="translate(60, 25)">
    <rect x="0" y="0" width="80" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Calendar red top bar -->
    <rect x="0" y="0" width="80" height="25" rx="6" fill="#ef4444"/>
    <rect x="0" y="18" width="80" height="7" fill="#ef4444"/>
    <!-- Rings -->
    <rect x="18" y="-4" width="6" height="8" rx="2" fill="#64748b"/>
    <rect x="56" y="-4" width="6" height="8" rx="2" fill="#64748b"/>
    <text x="40" y="16" font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">MES DE PAGO</text>
    <!-- Big star / Payday number -->
    <circle cx="40" cy="58" r="22" fill="#fef08a"/>
    <text x="40" y="66" font-family="sans-serif" font-size="24" font-weight="900" fill="#15803d" text-anchor="middle">$$</text>
    <text x="40" y="85" font-family="sans-serif" font-size="7.5" font-weight="800" fill="#16a34a" text-anchor="middle">¡PAGADO!</text>
  </g>

  <!-- Banknotes Fan -->
  <g transform="translate(170, 40)">
    <!-- Note 1 -->
    <rect x="0" y="15" width="95" height="50" rx="4" transform="rotate(-15 0 15)" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
    <!-- Note 2 -->
    <rect x="5" y="10" width="95" height="50" rx="4" transform="rotate(8 5 10)" fill="#4ade80" stroke="#15803d" stroke-width="1.5"/>
    <!-- Note 3 Front -->
    <rect x="10" y="20" width="95" height="50" rx="4" fill="url(#g_money)" stroke="#14532d" stroke-width="2"/>
    <circle cx="57.5" cy="45" r="12" fill="#86efac" opacity="0.6"/>
    <text x="57.5" y="50" font-family="sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">COP</text>
    <rect x="15" y="25" width="10" height="10" rx="1" fill="#bbf7d0" opacity="0.6"/>
    <rect x="90" y="55" width="10" height="10" rx="1" fill="#bbf7d0" opacity="0.6"/>
  </g>

  <!-- Golden Coins -->
  <g transform="translate(140, 95)">
    <circle cx="15" cy="15" r="14" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <circle cx="35" cy="18" r="12" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  </g>
</svg>
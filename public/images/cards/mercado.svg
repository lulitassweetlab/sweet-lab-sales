<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_mkt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#bg_mkt)"/>

  <!-- Stock market board screen -->
  <g transform="translate(45, 25)">
    <rect x="0" y="0" width="140" height="95" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <!-- Header -->
    <rect x="0" y="0" width="140" height="18" rx="6" fill="#1e293b"/>
    <text x="12" y="13" font-family="monospace" font-size="8" fill="#38bdf8" font-weight="900">MERCADO • OFERTAS</text>
    <!-- Candlesticks -->
    <line x1="25" y1="30" x2="25" y2="75" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="21" y="40" width="8" height="25" rx="1" fill="#22c55e"/>
    
    <line x1="50" y1="35" x2="50" y2="85" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="46" y="50" width="8" height="22" rx="1" fill="#ef4444"/>

    <line x1="75" y1="25" x2="75" y2="65" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="71" y="32" width="8" height="24" rx="1" fill="#22c55e"/>

    <line x1="100" y1="20" x2="100" y2="60" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="96" y="26" width="8" height="26" rx="1" fill="#22c55e"/>

    <line x1="125" y1="15" x2="125" y2="50" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="121" y="20" width="8" height="20" rx="1" fill="#22c55e"/>

    <!-- Upward Trend line -->
    <path d="M 15 70 Q 60 65 95 35 T 135 22" fill="none" stroke="#facc15" stroke-width="2.5"/>
  </g>

  <!-- Handshake Deal -->
  <g transform="translate(205, 45)">
    <!-- Briefcase -->
    <rect x="10" y="25" width="70" height="50" rx="4" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <path d="M 32 25 L 32 15 L 58 15 L 58 25" fill="none" stroke="#451a03" stroke-width="3"/>
    <rect x="38" y="32" width="14" height="8" rx="1" fill="#facc15"/>
    <!-- Gold coin badge -->
    <circle cx="45" cy="72" r="14" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <text x="45" y="77" font-family="sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">$</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_biz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#bg_biz)"/>
  
  <!-- Storefront -->
  <g transform="translate(75, 20)">
    <!-- Base building -->
    <rect x="10" y="30" width="150" height="95" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Awning (Striped) -->
    <path d="M 0 30 L 170 30 L 160 8 L 10 8 Z" fill="#9333ea"/>
    <polygon points="10,8 35,8 25,30 0,30" fill="#ec4899"/>
    <polygon points="50,8 75,8 65,30 40,30" fill="#ec4899"/>
    <polygon points="90,8 115,8 105,30 80,30" fill="#ec4899"/>
    <polygon points="130,8 155,8 145,30 120,30" fill="#ec4899"/>

    <!-- Signboard -->
    <rect x="45" y="34" width="80" height="16" rx="3" fill="#1e1b4b"/>
    <text x="85" y="46" font-family="sans-serif" font-size="8.5" font-weight="900" fill="#facc15" text-anchor="middle">NEGOCIO / LOCAL</text>

    <!-- Showcase window -->
    <rect x="22" y="56" width="55" height="48" rx="3" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <rect x="30" y="65" width="16" height="18" rx="2" fill="#f43f5e"/>
    <rect x="52" y="65" width="16" height="18" rx="2" fill="#10b981"/>
    
    <!-- Door -->
    <rect x="92" y="56" width="45" height="69" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="96" y="60" width="37" height="35" rx="1" fill="#bae6fd"/>
    <circle cx="127" cy="94" r="2.5" fill="#ca8a04"/>

    <!-- Open sign -->
    <rect x="104" y="66" width="22" height="10" rx="2" fill="#16a34a"/>
    <text x="115" y="74" font-family="sans-serif" font-size="6" font-weight="900" fill="#ffffff" text-anchor="middle">ABIERTO</text>
  </g>

  <!-- Floating Cash Register / Shopping Bag -->
  <g transform="translate(240, 75)">
    <!-- Bag -->
    <path d="M 10 20 L 45 20 L 40 55 L 15 55 Z" fill="#f59e0b"/>
    <path d="M 20 20 C 20 8 35 8 35 20" fill="none" stroke="#b45309" stroke-width="3"/>
    <text x="27.5" y="42" font-family="sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">★</text>
  </g>

  <!-- Left Coins -->
  <g transform="translate(25, 90)">
    <circle cx="18" cy="18" r="14" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <text x="18" y="23" font-family="sans-serif" font-size="14" font-weight="900" fill="#92400e" text-anchor="middle">$</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_bnk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#bg_bnk)"/>

  <!-- Bank Building -->
  <g transform="translate(50, 25)">
    <!-- Roof pediment -->
    <polygon points="60,0 0,26 120,26" fill="#1e293b"/>
    <rect x="6" y="26" width="108" height="8" fill="#334155"/>
    <!-- Columns -->
    <rect x="14" y="34" width="14" height="60" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="38" y="34" width="14" height="60" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="68" y="34" width="14" height="60" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="92" y="34" width="14" height="60" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <!-- Base -->
    <rect x="0" y="94" width="120" height="12" rx="2" fill="#1e293b"/>
  </g>

  <!-- Approved Credit Card & Cash -->
  <g transform="translate(185, 45)">
    <!-- Credit Card -->
    <rect x="0" y="0" width="90" height="56" rx="6" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="0" y="10" width="90" height="10" fill="#0f172a"/>
    <!-- Chip -->
    <rect x="12" y="26" width="14" height="11" rx="2" fill="#facc15"/>
    <text x="80" y="48" font-family="monospace" font-size="8" fill="#ffffff" text-anchor="end">VISA</text>
    <!-- Green Check badge -->
    <circle cx="80" cy="8" r="12" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
    <text x="80" y="12.5" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text>
  </g>
</svg>
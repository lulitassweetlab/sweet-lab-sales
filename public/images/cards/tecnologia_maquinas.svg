<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_tech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#bg_tech)"/>

  <!-- Left: Vending Machine -->
  <g transform="translate(60, 20)">
    <rect x="0" y="0" width="75" height="120" rx="8" fill="#1e293b"/>
    <rect x="5" y="5" width="65" height="110" rx="6" fill="#334155"/>
    <!-- Glass front -->
    <rect x="10" y="10" width="55" height="65" rx="4" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
    
    <!-- Shelf 1 items -->
    <rect x="15" y="16" width="10" height="16" rx="2" fill="#ef4444"/>
    <rect x="29" y="16" width="10" height="16" rx="2" fill="#3b82f6"/>
    <rect x="43" y="16" width="10" height="16" rx="2" fill="#10b981"/>
    <line x1="10" y1="34" x2="65" y2="34" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Shelf 2 items -->
    <rect x="15" y="40" width="11" height="14" rx="2" fill="#f59e0b"/>
    <rect x="30" y="40" width="11" height="14" rx="2" fill="#ec4899"/>
    <rect x="45" y="40" width="11" height="14" rx="2" fill="#8b5cf6"/>
    <line x1="10" y1="56" x2="65" y2="56" stroke="#475569" stroke-width="1.5"/>

    <!-- Keypad & Slot -->
    <rect x="12" y="80" width="22" height="14" rx="2" fill="#0284c7"/>
    <text x="23" y="90" font-family="monospace" font-size="7" fill="#ffffff" text-anchor="middle">24/7</text>
    <rect x="42" y="82" width="18" height="5" rx="1" fill="#0f172a"/>

    <!-- Dispenser -->
    <rect x="12" y="98" width="51" height="13" rx="2" fill="#0f172a"/>
  </g>

  <!-- Right: Laundry / Automated Kiosk -->
  <g transform="translate(180, 25)">
    <rect x="0" y="0" width="80" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Control panel -->
    <rect x="10" y="8" width="60" height="18" rx="3" fill="#e2e8f0"/>
    <circle cx="20" cy="17" r="4" fill="#0284c7"/>
    <circle cx="32" cy="17" r="4" fill="#10b981"/>
    <rect x="44" y="12" width="20" height="10" rx="2" fill="#0f172a"/>
    <text x="54" y="19.5" font-family="monospace" font-size="6" fill="#38bdf8" text-anchor="middle">RUN</text>

    <!-- Glass drum -->
    <circle cx="40" cy="65" r="32" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="40" cy="65" r="24" fill="#38bdf8" opacity="0.8"/>
    <!-- Swirl clothes -->
    <path d="M 30 65 Q 40 50 50 65 T 30 65" fill="#f43f5e" opacity="0.9"/>
    <circle cx="45" cy="58" r="6" fill="#facc15"/>
  </g>
</svg>
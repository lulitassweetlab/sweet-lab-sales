<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_tr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#bg_tr)"/>

  <!-- Road -->
  <rect x="0" y="120" width="320" height="40" fill="#334155"/>
  <line x1="0" y1="140" x2="320" y2="140" stroke="#facc15" stroke-width="3" stroke-dasharray="16,12"/>

  <!-- Delivery Van -->
  <g transform="translate(70, 48)">
    <!-- Van Body -->
    <path d="M 0 25 L 0 70 L 160 70 L 160 40 L 130 18 L 90 18 L 90 25 Z" fill="#2563eb"/>
    <!-- Cabin Window -->
    <polygon points="98,24 125,24 150,42 98,42" fill="#93c5fd"/>
    <!-- Headlight -->
    <rect x="156" y="50" width="4" height="8" rx="1" fill="#fef08a"/>
    <!-- Cargo line & handle -->
    <line x1="85" y1="20" x2="85" y2="70" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="76" y="45" width="4" height="8" rx="1" fill="#ffffff"/>
    
    <!-- Wheels -->
    <circle cx="35" cy="70" r="16" fill="#0f172a"/>
    <circle cx="35" cy="70" r="7" fill="#cbd5e1"/>
    <circle cx="125" cy="70" r="16" fill="#0f172a"/>
    <circle cx="125" cy="70" r="7" fill="#cbd5e1"/>

    <!-- Delivery Logo -->
    <circle cx="45" cy="42" r="12" fill="#ffffff"/>
    <path d="M 38 42 L 44 48 L 54 36" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Pin Location badge -->
  <g transform="translate(250, 30)">
    <path d="M 15 0 C 7 0 0 7 0 15 C 0 25 15 42 15 42 C 15 42 30 25 30 15 C 30 7 23 0 15 0 Z" fill="#ef4444"/>
    <circle cx="15" cy="15" r="6" fill="#ffffff"/>
  </g>
</svg>
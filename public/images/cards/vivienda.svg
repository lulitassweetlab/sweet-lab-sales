<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_liv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#bg_liv)"/>

  <!-- Green Grass Hill -->
  <path d="M 0 130 Q 160 115 320 130 L 320 160 L 0 160 Z" fill="#22c55e"/>

  <!-- Moving Truck -->
  <g transform="translate(30, 65)">
    <rect x="0" y="10" width="70" height="50" rx="3" fill="#3b82f6"/>
    <!-- Cabin -->
    <path d="M 70 25 L 95 25 L 105 45 L 105 60 L 70 60 Z" fill="#2563eb"/>
    <polygon points="76,30 92,30 100,45 76,45" fill="#93c5fd"/>
    <!-- Wheels -->
    <circle cx="22" cy="60" r="10" fill="#0f172a"/>
    <circle cx="22" cy="60" r="4" fill="#cbd5e1"/>
    <circle cx="88" cy="60" r="10" fill="#0f172a"/>
    <circle cx="88" cy="60" r="4" fill="#cbd5e1"/>
    <!-- Box in truck -->
    <text x="35" y="40" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">MUDANZA</text>
  </g>

  <!-- Beautiful New House -->
  <g transform="translate(170, 30)">
    <polygon points="50,0 5,30 95,30" fill="#dc2626"/>
    <rect x="15" y="30" width="70" height="65" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Chimney -->
    <rect x="70" y="8" width="12" height="20" fill="#991b1b"/>
    <!-- Door -->
    <rect x="40" y="58" width="20" height="37" rx="2" fill="#78350f"/>
    <circle cx="55" cy="78" r="2" fill="#facc15"/>
    <!-- Windows -->
    <rect x="23" y="40" width="15" height="15" rx="1" fill="#38bdf8"/>
    <rect x="62" y="40" width="15" height="15" rx="1" fill="#38bdf8"/>
  </g>
</svg>
<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Administrar Postres</title>
	<link rel="stylesheet" href="/styles.css?v=2025-09-17-1" />
	<style>
		.cost-price-input {
			width: 10ch;
			min-width: 10ch;
			text-align: right;
			border: 1px solid transparent;
			cursor: text;
			transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
			-moz-appearance: textfield;
			appearance: textfield;
		}
		.cost-price-input:hover {
			background: var(--secondary);
			border-color: var(--border);
			box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
		}
		.cost-price-input:focus {
			background: var(--secondary);
			border-color: var(--border);
		}
		[data-theme="dark"] .cost-price-input:hover {
			background: #2a2a2a;
			box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
		}

		.cost-price-input::-webkit-outer-spin-button,
		.cost-price-input::-webkit-inner-spin-button {
			-webkit-appearance: none;
			margin: 0;
		}
	</style>
</head>
<body>
	<header class="app-header">
		<div class="header-row">
			<div class="header-left">
				<img src="/logo.png" alt="Lulitas Logo" class="app-logo" />
				<h1>Administrar Postres</h1>
			</div>
			<div class="header-actions">
				<button id="back-btn" class="press-btn">Volver</button>
			</div>
		</div>
	</header>

	<main class="sales-panel">
		<div class="panel-header">
			<h3>Postres Disponibles</h3>
			<div class="panel-actions">
				<button id="add-dessert-btn" class="press-btn btn-primary">+ Nuevo Postre</button>
			</div>
		</div>
		<div class="panel-body">
			<div class="table-wrapper">
				<table id="desserts-table">
					<thead>
						<tr>
							<th>Nombre</th>
							<th>Código</th>
							<th>Precio de Venta</th>
							<th>Precio a Costo</th>
							<th>Posición</th>
							<th>Estado</th>
							<th>Acciones</th>
						</tr>
					</thead>
					<tbody id="desserts-tbody"></tbody>
				</table>
			</div>
		</div>
	</main>

	<script type="module">
	(function(){
		const tbody = document.getElementById('desserts-tbody');
		const backBtn = document.getElementById('back-btn');
		const addBtn = document.getElementById('add-dessert-btn');
		
		const fmtMoney = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
		const DEFAULT_COST_PRICE_MULTIPLIER = 0.55;
		
		function getDefaultCostPrice(salePrice) {
			return Math.round((Number(salePrice || 0) || 0) * DEFAULT_COST_PRICE_MULTIPLIER);
		}
		
		function getEffectiveCostPrice(dessert) {
			const configured = Number(dessert?.cost_price);
			if (Number.isFinite(configured) && configured >= 0) return Math.round(configured);
			return getDefaultCostPrice(dessert?.sale_price);
		}
		
		async function updateDessertCostPrice(dessert, costPrice) {
			const response = await fetch('/api/desserts', {
				method: 'PUT',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({
					id: dessert.id,
					name: dessert.name,
					sale_price: dessert.sale_price,
					cost_price: costPrice,
					position: dessert.position,
					is_active: dessert.is_active
				})
			});
			if (!response.ok) throw new Error('Failed to update cost price');
			return response.json();
		}
		
		async function loadDesserts() {
			try {
				const response = await fetch('/api/desserts');
				if (!response.ok) throw new Error('Failed to load desserts');
				const desserts = await response.json();
				renderDesserts(desserts);
			} catch (err) {
				console.error('Error loading desserts:', err);
				alert('Error al cargar los postres');
			}
		}
		
		function renderDesserts(desserts) {
			tbody.innerHTML = '';
			for (const d of desserts) {
				const tr = document.createElement('tr');
				
				const tdName = document.createElement('td');
				tdName.textContent = d.name;
				
				const tdCode = document.createElement('td');
				tdCode.textContent = d.short_code;
				
				const tdPrice = document.createElement('td');
				tdPrice.textContent = fmtMoney.format(d.sale_price);
				
				const tdCostPrice = document.createElement('td');
				const costInput = document.createElement('input');
				costInput.className = 'input-cell cost-price-input';
				costInput.type = 'number';
				costInput.min = '0';
				costInput.step = '100';
				costInput.inputMode = 'numeric';
				costInput.value = String(getEffectiveCostPrice(d));
				costInput.title = 'Presiona Enter o sal del campo para guardar';
				let savingCost = false;
				const selectAllCostInput = () => {
					if (savingCost || costInput.disabled) return;
					try {
						costInput.select();
					} catch {}
				};
				
				const saveCostFromInput = async () => {
					if (savingCost) return;
					const prevCost = getEffectiveCostPrice(d);
					const nextCost = Math.max(0, Math.round(Number(costInput.value || 0) || 0));
					if (nextCost === prevCost) {
						costInput.value = String(prevCost);
						return;
					}
					
					savingCost = true;
					costInput.disabled = true;
					try {
						const updated = await updateDessertCostPrice(d, nextCost);
						const savedCost = Number(updated?.cost_price);
						d.cost_price = Number.isFinite(savedCost) && savedCost >= 0 ? Math.round(savedCost) : nextCost;
						costInput.value = String(d.cost_price);
					} catch (err) {
						console.error('Error updating cost price:', err);
						costInput.value = String(prevCost);
						alert('Error al guardar el precio a costo');
					} finally {
						savingCost = false;
						costInput.disabled = false;
					}
				};
				
				costInput.addEventListener('focus', () => {
					requestAnimationFrame(selectAllCostInput);
				});
				costInput.addEventListener('click', () => {
					requestAnimationFrame(selectAllCostInput);
				});
				costInput.addEventListener('blur', saveCostFromInput);
				costInput.addEventListener('keydown', (ev) => {
					if (ev.key === 'Enter') {
						ev.preventDefault();
						costInput.blur();
					}
				});
				tdCostPrice.appendChild(costInput);
				
				const tdPos = document.createElement('td');
				tdPos.textContent = d.position;
				
				const tdStatus = document.createElement('td');
				tdStatus.textContent = d.is_active ? 'Activo' : 'Inactivo';
				tdStatus.style.color = d.is_active ? 'green' : 'gray';
				
				const tdActions = document.createElement('td');
				tdActions.style.display = 'flex';
				tdActions.style.gap = '6px';
				tdActions.style.justifyContent = 'center';
				
				const editBtn = document.createElement('button');
				editBtn.className = 'press-btn';
				editBtn.textContent = 'Editar';
				editBtn.addEventListener('click', () => openEditDessert(d));
				
				const toggleBtn = document.createElement('button');
				toggleBtn.className = 'press-btn';
				toggleBtn.textContent = d.is_active ? 'Desactivar' : 'Activar';
				toggleBtn.addEventListener('click', async () => {
					await toggleDessert(d);
					loadDesserts();
				});
				
				const deleteBtn = document.createElement('button');
				deleteBtn.className = 'row-delete';
				deleteBtn.title = 'Eliminar';
				deleteBtn.setAttribute('aria-label', 'Eliminar');
				deleteBtn.addEventListener('click', async () => {
					const confirmed = confirm(`¿Seguro que quieres eliminar "${d.name}"? Esta acción no se puede deshacer.`);
					if (confirmed) {
						await deleteDessert(d.id);
						loadDesserts();
					}
				});
				
				tdActions.appendChild(editBtn);
				tdActions.appendChild(toggleBtn);
				tdActions.appendChild(deleteBtn);
				
				tr.append(tdName, tdCode, tdPrice, tdCostPrice, tdPos, tdStatus, tdActions);
				tbody.appendChild(tr);
			}
		}
		
		async function toggleDessert(dessert) {
			try {
				const response = await fetch('/api/desserts', {
					method: 'PUT',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ 
						id: dessert.id, 
						name: dessert.name,
						sale_price: dessert.sale_price,
						cost_price: getEffectiveCostPrice(dessert),
						position: dessert.position,
						is_active: !dessert.is_active
					})
				});
				if (!response.ok) throw new Error('Failed to toggle dessert');
				alert(dessert.is_active ? 'Postre desactivado' : 'Postre activado');
			} catch (err) {
				console.error('Error toggling dessert:', err);
				alert('Error al cambiar el estado del postre');
			}
		}
		
		async function deleteDessert(id) {
			try {
				const response = await fetch(`/api/desserts?id=${id}`, {
					method: 'DELETE'
				});
				if (!response.ok) throw new Error('Failed to delete dessert');
				alert('Postre eliminado exitosamente');
			} catch (err) {
				console.error('Error deleting dessert:', err);
				alert('Error al eliminar el postre');
			}
		}
		
		function openEditDessert(dessert) {
			const pop = document.createElement('div');
			pop.className = 'confirm-popover';
			pop.style.position = 'fixed';
			pop.style.left = (window.innerWidth / 2) + 'px';
			pop.style.top = '12%';
			pop.style.transform = 'translate(-50%, 0)';
			pop.style.zIndex = '1000';
			
			const title = document.createElement('h4');
			title.textContent = dessert ? 'Editar Postre' : 'Nuevo Postre';
			title.style.margin = '0 0 12px 0';
			
			const form = document.createElement('div');
			form.style.display = 'flex';
			form.style.flexDirection = 'column';
			form.style.gap = '10px';
			form.style.minWidth = '320px';
			
			const nameLabel = document.createElement('label');
			nameLabel.textContent = 'Nombre:';
			const nameInput = document.createElement('input');
			nameInput.className = 'input-cell';
			nameInput.type = 'text';
			nameInput.value = dessert ? dessert.name : '';
			nameInput.placeholder = 'Ej: Cheesecake';
			
			const codeLabel = document.createElement('label');
			codeLabel.textContent = 'Código (4 letras):';
			const codeInput = document.createElement('input');
			codeInput.className = 'input-cell';
			codeInput.type = 'text';
			codeInput.maxLength = 4;
			codeInput.value = dessert ? dessert.short_code : '';
			codeInput.placeholder = 'Ej: chee';
			codeInput.disabled = !!dessert; // Can't change code after creation
			
			const priceLabel = document.createElement('label');
			priceLabel.textContent = 'Precio de Venta:';
			const priceInput = document.createElement('input');
			priceInput.className = 'input-cell';
			priceInput.type = 'number';
			priceInput.min = '0';
			priceInput.step = '100';
			priceInput.value = dessert ? dessert.sale_price : '';
			priceInput.placeholder = 'Ej: 15000';
			
			const posLabel = document.createElement('label');
			posLabel.textContent = 'Posición:';
			const posInput = document.createElement('input');
			posInput.className = 'input-cell';
			posInput.type = 'number';
			posInput.min = '0';
			posInput.step = '1';
			posInput.value = dessert ? dessert.position : '0';
			
			const actions = document.createElement('div');
			actions.className = 'confirm-actions';
			actions.style.marginTop = '12px';
			
			const saveBtn = document.createElement('button');
			saveBtn.className = 'press-btn btn-primary';
			saveBtn.textContent = dessert ? 'Guardar' : 'Crear';
			
			const cancelBtn = document.createElement('button');
			cancelBtn.className = 'press-btn';
			cancelBtn.textContent = 'Cancelar';
			
			actions.append(saveBtn, cancelBtn);
			
			form.append(
				nameLabel, nameInput,
				codeLabel, codeInput,
				priceLabel, priceInput,
				posLabel, posInput
			);
			
			pop.append(title, form, actions);
			document.body.appendChild(pop);
			pop.classList.add('aladdin-pop');
			
			saveBtn.addEventListener('click', async () => {
				const name = nameInput.value.trim();
				const code = codeInput.value.trim().toLowerCase();
				const price = Number(priceInput.value) || 0;
				const position = Number(posInput.value) || 0;
				
				if (!name) {
					alert('El nombre es requerido');
					return;
				}
				if (!code || code.length !== 4) {
					alert('El código debe tener exactamente 4 letras');
					return;
				}
				if (price <= 0) {
					alert('El precio debe ser mayor a 0');
					return;
				}
				
				try {
					const method = dessert ? 'PUT' : 'POST';
					const body = dessert 
						? { id: dessert.id, name, sale_price: price, cost_price: getEffectiveCostPrice(dessert), position, is_active: dessert.is_active }
						: { name, short_code: code, sale_price: price, cost_price: getDefaultCostPrice(price), position };
					
					const response = await fetch('/api/desserts', {
						method,
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify(body)
					});
					
					if (!response.ok) throw new Error('Failed to save dessert');
					
					document.body.removeChild(pop);
					loadDesserts();
					alert(dessert ? 'Postre actualizado' : 'Postre creado exitosamente');
				} catch (err) {
					console.error('Error saving dessert:', err);
					alert('Error al guardar el postre');
				}
			});
			
			cancelBtn.addEventListener('click', () => {
				document.body.removeChild(pop);
			});
			
			nameInput.focus();
		}
		
		addBtn.addEventListener('click', () => openEditDessert(null));
		
		backBtn.addEventListener('click', () => {
			window.location.href = '/index.html';
		});
		
		loadDesserts();
	})();
	</script>
</body>
</html>

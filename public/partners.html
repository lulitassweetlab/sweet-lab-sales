<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socios | Sweet Lab</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { 
            --p-mod: #6366f1; 
            --accent: #8b5cf6;
            --bg: #f8fafc;
            --txt: #0f172a;
            --txt-mute: #64748b;
            --card-sh: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05);
        }
        body { background: var(--bg); color: var(--txt); font-family: 'Inter', -apple-system, system-ui, sans-serif; padding: 20px; line-height: 1.5; }
        .box { background: white; border-radius: 24px; padding: 32px; margin-bottom: 30px; box-shadow: var(--card-sh); border: 1px solid rgba(226,232,240,0.5); }
        .hdr { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; padding: 48px; border-radius: 32px; margin-bottom: 40px; position: relative; overflow: hidden; box-shadow: 0 20px 40px -15px rgba(99,102,241,0.4); }
        .hdr::after { content:''; position:absolute; top:-50%; right:-10%; width:300px; height:300px; background: rgba(255,255,255,0.1); border-radius: 50%; }
        .btn-set { position: fixed; bottom: 30px; right: 30px; z-index: 5000; background: var(--p-mod); color: white; border: none; width: 60px; height: 60px; border-radius: 20px; cursor: pointer; font-size: 1.8rem; box-shadow: 0 10px 20px rgba(99,102,241,0.3); display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
        .btn-set:hover { transform: scale(1.05); }
        .flex { display: flex; justify-content: space-between; align-items: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        .fin-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.95rem; }
        .fin-item:last-child { border-bottom: none; }
        .fin-label { color: var(--txt-mute); font-weight: 500; }
        .fin-val { font-weight: 700; color: var(--txt); }
        .fin-val.neg { color: #e11d48; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.6); backdrop-filter: blur(8px); z-index: 6000; align-items: center; justify-content: center; }
        .modal-c { background: white; padding: 40px; border-radius: 32px; width: 95%; max-width: 500px; color: var(--txt); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .pill { background: #f1f5f9; padding: 4px 12px; border-radius: 100px; font-size: 0.75rem; font-weight: 700; color: var(--txt-mute); }
        .back-btn { background: white; border: 1px solid #e2e8f0; padding: 10px 20px; border-radius: 14px; cursor: pointer; font-weight: 600; color: var(--txt-mute); display: flex; align-items: center; gap: 8px; margin-bottom: 24px; transition: all 0.2s; }
        .stat-card { background: rgba(255,255,255,0.15); padding: 15px 25px; border-radius: 20px; backdrop-filter: blur(10px); }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.8; margin-bottom: 4px; }
        .stat-val { font-size: 1.2rem; font-weight: 800; }
        .popover-wrap { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 9999; backdrop-filter: blur(4px); }
    </style>
</head>
<body>
    <button class="btn-set" id="cfg-btn" style="display:none">✨</button>
    
    <!-- Login Overlay -->
    <div id="login-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:9999; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:20px;">
        <h2 style="margin:0; color:#1e293b">Acceso Restringido</h2>
        <input type="password" id="pass-input" placeholder="Introduce la clave" style="padding:12px; border-radius:12px; border:1px solid #cbd5e1; width:200px; text-align:center;">
        <button id="login-btn" style="padding:12px 24px; background:#4f46e5; color:white; border:none; border-radius:12px; cursor:pointer; font-weight:700;">Entrar</button>
    </div>

    <div id="main-content" style="max-width: 1000px; margin: 0 auto; padding-bottom: 100px; display:none;">
        <button onclick="location.href='/'" class="back-btn">← Volver al inicio</button>
        
        <header class="hdr">
            <div style="z-index: 2; position: relative;">
                <h1 style="margin:0; font-size: 2.5rem; letter-spacing: -0.02em;">Portal de Socios</h1>
                <p style="opacity:0.9; font-size: 1.1rem; margin-top: 8px; font-weight: 500;">Reporte Financiero y de Valorización</p>
                
                <div id="quick-stats" style="display:flex; gap:20px; margin-top:32px; flex-wrap: wrap;">
                    <div class="stat-card">
                        <div class="stat-label">Ventas Totales (Historico)</div>
                        <div class="stat-val" id="stat-rev">$0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Utilidad Neta Acumulada</div>
                        <div class="stat-val" id="stat-prof">$0</div>
                    </div>
                </div>
            </div>
        </header>

        <div id="status-msg" style="text-align:center; padding: 40px; background: white; border-radius: 20px; box-shadow: var(--card-sh);">
            <p id="status-text" style="font-weight:600; color:#475569;">Iniciando conexión segura...</p>
        </div>

        <div id="report-content" style="display:none"></div>
    </div>

    <!-- Modal Config -->
    <div id="modal-cfg" class="modal">
        <div class="modal-c">
            <h2>Configuración</h2>
            <div id="cfg-sellers" style="max-height: 250px; overflow-y: auto;"></div>
            
            <div style="margin-top: 15px; padding: 15px; background: #f8fafc; border-radius: 15px; border: 1px solid #e2e8f0;">
                <h4 style="margin:0 0 10px 0; font-size: 0.85rem; color: #64748b; text-transform: uppercase;">Modelo de Distribución</h4>
                <select id="dist-model" style="width:100%; padding:8px; border-radius:8px; border:1px solid #ddd; font-size:0.9rem;">
                    <option value="pro">Modelo PRO (EMA - Dinámico)</option>
                    <option value="triple">Modelo Triple Horizonte (33/33/34)</option>
                    <option value="historic">Modelo Histórico (Acumulado Total)</option>
                </select>
                <p id="model-desc" style="font-size:0.7rem; color:#94a3b8; margin-top:6px; line-height:1.3; margin-bottom:0;"></p>
            </div>

            <div style="margin-top: 15px; padding: 15px; background: #f8fafc; border-radius: 15px; border: 1px solid #e2e8f0;">
                <h4 style="margin:0 0 10px 0; font-size: 0.85rem; color: #64748b; text-transform: uppercase;">Ajustes de Fundador (Fijo %)</h4>
                <div id="founder-config-list" style="display:flex; flex-direction:column; gap:8px;"></div>
            </div>

            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee;">
                <button onclick="location.href='?auth=admin&force_sync=1'" style="width:100%; padding:10px; background:#f8fafc; border:1px solid #ddd; border-radius:10px; cursor:pointer; font-size:0.8rem; color:#666;">🔄 Recalcular Todo el Historial</button>
            </div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button id="save-cfg" style="flex:1; padding:12px; background:#4f46e5; color:white; border:none; border-radius:12px; cursor:pointer">Guardar</button>
                <button onclick="document.getElementById('modal-cfg').style.display='none'" style="flex:1; padding:12px; border-radius:12px; cursor:pointer">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        let DATA = null; 
        let SELLERS = [];
        const fmt = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
        
        const updateStatus = (t) => {
            const el = document.getElementById('status-text');
            if (el) el.innerText = t;
        };

        window.closePopover = (btn) => {
            const wrap = btn.closest('.popover-wrap');
            if (wrap) wrap.remove();
        };

        window.showRevenueDetails = (month, ev) => {
            if (ev.target.tagName.toLowerCase() === 'input' || ev.target.tagName.toLowerCase() === 'button') return;
            const details = window.revenueDetailsMap[month] || [];
            if (!details.length) return alert("No hay desglose disponible.");
            
            const html = details.map(d => {
                let daysHtml = '';
                if (d.days && d.days.length) {
                    daysHtml = '<div style="margin-top:8px; padding-left:12px; border-left:2px solid #e2e8f0; display:flex; flex-direction:column; gap:4px">';
                    d.days.forEach(day => {
                        daysHtml += `<a href="/index.html?seller=${encodeURIComponent(d.seller_name)}&date=${day.date}" target="_blank" style="text-decoration:none; display:flex; justify-content:space-between; font-size:0.8rem; color:#4f46e5; font-weight:600; padding:4px 6px; border-radius:6px;"><span>🔗 🗓 ${day.date}</span><span style="color:#64748b">${fmt.format(day.amount)}</span></a>`;
                    });
                    daysHtml += '</div>';
                }
                return `<div style="margin-bottom:12px; background:#f8fafc; padding:12px; border-radius:12px; border:1px solid #f1f5f9">
                    <div style="display:flex; justify-content:space-between; border-bottom:1px solid #e2e8f0; padding-bottom:6px; margin-bottom:4px">
                        <span style="font-weight:700">${d.seller_name}</span>
                        <strong style="color:#10b981">${fmt.format(d.amount)}</strong>
                    </div>
                    ${daysHtml}
                </div>`;
            }).join('');
            
            const pop = document.createElement('div');
            pop.className = 'popover-wrap';
            pop.innerHTML = `<div style="background:#fff; padding:24px; border-radius:24px; min-width:320px; box-shadow:0 20px 25px -5px rgba(0,0,0,0.1);">
                <h3 style="margin:0 0 16px 0; color:#0f172a; border-bottom:1px solid #e2e8f0; padding-bottom:12px; font-size:1.1rem;">💵 Detalle de Ventas</h3>
                <div style="max-height:50vh; overflow-y:auto;">${html}</div>
                <div style="display:flex; justify-content:space-between; margin-top:16px; padding-top:12px; border-top:2px dashed #cbd5e1; font-weight:900;">
                    <span>TOTAL</span><span style="color:#10b981">${fmt.format(details.reduce((a,b)=>a+b.amount,0))}</span>
                </div>
                <button onclick="closePopover(this)" style="margin-top:24px; width:100%; padding:12px; border-radius:12px; border:none; background:#f1f5f9; cursor:pointer; font-weight:800; color:#475569;">Cerrar</button>
            </div>`;
            document.body.appendChild(pop);
        };

        window.showProductDetails = (month, ev) => {
            if (ev.target.tagName.toLowerCase() === 'input' || ev.target.tagName.toLowerCase() === 'button') return;
            const details = window.productDetailsMap[month] || [];
            if (!details.length) return alert("No hay desglose disponible.");
            
            const html = details.map(d => {
                let prodsHtml = '<table style="width:100%; border-collapse:collapse; margin-top:12px; font-size:0.8rem">';
                prodsHtml += '<tr style="border-bottom:1px solid #cbd5e1; color:#64748b"><th style="text-align:left;">Postre</th><th style="text-align:right;">Cant.</th><th style="text-align:right;">Margen</th></tr>';
                (d.products || []).forEach(p => {
                    let margin = p.revenue > 0 ? Math.round(((p.revenue - p.cogs) / p.revenue) * 100) : 0;
                    prodsHtml += `<tr style="border-bottom:1px solid #f1f5f9; color:#475569">
                        <td style="padding:6px 0">${p.name}</td>
                        <td style="text-align:right;">${p.quantity || '-'}</td>
                        <td style="text-align:right; font-weight:600">${margin}%</td>
                    </tr>`;
                });
                prodsHtml += '</table>';
                return `<div style="margin-bottom:16px; background:#f8fafc; padding:16px; border-radius:12px; border:1px solid #f1f5f9">
                    <div style="font-weight:800; color:#334155; font-size:1.1rem; border-bottom:1px solid #eee; padding-bottom:4px;">${d.seller_name}</div>
                    ${prodsHtml}
                </div>`;
            }).join('');
            
            const pop = document.createElement('div');
            pop.className = 'popover-wrap';
            pop.innerHTML = `<div style="background:#fff; padding:24px; border-radius:24px; min-width:380px; max-width:500px; box-shadow:0 20px 25px -5px rgba(0,0,0,0.1);">
                <h3 style="margin:0 0 16px 0; color:#0f172a; border-bottom:1px solid #e2e8f0; padding-bottom:12px;">📊 Desempeño Operativo</h3>
                <div style="max-height:60vh; overflow-y:auto;">${html}</div>
                <button onclick="closePopover(this)" style="margin-top:24px; width:100%; padding:14px; border-radius:12px; border:none; background:#f1f5f9; cursor:pointer; font-weight:800; color:#475569;">Cerrar Dashboard</button>
            </div>`;
            document.body.appendChild(pop);
        };

        window.showExpenseDetails = (month, ev) => {
            if (ev.target.tagName.toLowerCase() === 'input' || ev.target.tagName.toLowerCase() === 'button') return;
            const details = window.expenseDetailsMap[month] || [];
            const dataForMonth = DATA.history.find(h => h.month === month);
            const finalTotal = dataForMonth ? dataForMonth.expenses : 0;
            const realSum = details.reduce((a, b) => a + b.amount, 0);
            const diff = finalTotal - realSum;

            const html = details.map(d => {
                const tagsHtml = (d.tags || []).map(t => `<span style="background:${t.color}; color:white; padding:2px 6px; border-radius:10px; font-size:0.65rem; margin-left:4px;">${t.name}</span>`).join('');
                return `<div style="margin-bottom:8px; background:#f8fafc; padding:12px; border-radius:14px; border:1px solid #f1f5f9; display:flex; justify-content:space-between; align-items:center;">
                    <div style="flex:1;"><div style="font-size:0.85rem; font-weight:700; color:#334155;">${d.description}</div><div style="font-size:0.7rem; color:#94a3b8;">${d.date} ${tagsHtml}</div></div>
                    <strong style="color:#ef4444;">-${fmt.format(d.amount)}</strong>
                </div>`;
            }).join('');

            const pop = document.createElement('div');
            pop.className = 'popover-wrap';
            
            const saveAdj = async (btn) => {
                const val = Number(document.getElementById(`adj-input-${month}`).value) || 0;
                btn.disabled = true; btn.innerText = 'Guardando...';
                const keyName = `historic_${month.replace('-', '_')}`;
                const currentSettings = JSON.parse(DATA.settings[`historic_${month.replace('-', '_')}`] || '{}');
                currentSettings.expenses = realSum + val;
                try {
                    const res = await fetch('/api/store-settings', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ [keyName]: JSON.stringify(currentSettings) })
                    });
                    if (!res.ok) throw new Error('Error al guardar ajuste');
                    location.href = '?auth=admin&force_sync=1';
                } catch (e) {
                    alert(e.message);
                    btn.disabled = false; btn.innerText = 'Guardar Ajuste';
                }
            };

            pop.innerHTML = `<div style="background:#fff; padding:24px; border-radius:24px; min-width:380px; max-width:500px; box-shadow:0 20px 25px -5px rgba(0,0,0,0.1);">
                <h3 style="margin:0 0 16px 0; border-bottom:1px solid #e2e8f0; padding-bottom:12px;">💸 Detalle de Gastos</h3>
                <div style="max-height:50vh; overflow-y:auto; margin-bottom:16px;">
                    ${html || '<p style="text-align:center; color:#94a3b8;">No hay gastos registrados.</p>'}
                    <div style="margin-top:12px; background:#fff7ed; padding:12px; border-radius:14px; border:1px solid #ffedd5; display:flex; justify-content:space-between; align-items:center;">
                        <div style="font-size:0.85rem; font-weight:800; color:#9a3412">⚠️ Ajuste de Auditoría</div>
                        <input type="number" id="adj-input-${month}" value="${diff}" style="width:100px; padding:6px; border-radius:8px; border:1px solid #fed7aa; text-align:right; font-weight:700; color:#ef4444;">
                    </div>
                </div>
                <div style="display:flex; justify-content:space-between; padding:16px; background:#fef2f2; border-radius:16px; font-weight:900;">
                    <span>TOTAL FINAL</span><span style="color:#ef4444" id="pop-total-${month}">-${fmt.format(finalTotal)}</span>
                </div>
                <div style="display:flex; gap:10px; margin-top:24px">
                    <button id="save-adj-btn" style="flex:1; padding:14px; border-radius:12px; border:none; background:#8b5cf6; color:white; font-weight:800; cursor:pointer;">Guardar Ajuste</button>
                    <button onclick="closePopover(this)" style="flex:1; padding:14px; border-radius:12px; border:none; background:#f1f5f9; cursor:pointer; font-weight:800; color:#475569;">Cerrar</button>
                </div>
            </div>`;
            document.body.appendChild(pop);
            
            const input = document.getElementById(`adj-input-${month}`);
            const totalDisp = document.getElementById(`pop-total-${month}`);
            input.oninput = () => totalDisp.innerText = `-${fmt.format(realSum + (Number(input.value) || 0))}`;
            document.getElementById('save-adj-btn').onclick = function() { saveAdj(this); };
        };

        window.showSellerHistoryChart = (sellerName, targetMonth, ev) => {
            if (ev) ev.stopPropagation();
            if (!DATA || !DATA.history) return;
            const targetData = DATA.history.find(h => h.month === targetMonth);
            const partnerMeta = targetData?.partners?.find(p => p.name.toLowerCase() === sellerName.toLowerCase());
            if (!partnerMeta) return;

            const shortMonths = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
            const months = [...DATA.history].sort((a, b) => a.month.localeCompare(b.month)).slice(-24);
            const chartData = [];
            let maxRev = 0;
            months.forEach(m => {
                const revDetails = window.revenueDetailsMap[m.month] || [];
                const sellerEntry = revDetails.find(d => d.seller_name.toLowerCase() === sellerName.toLowerCase());
                const rev = sellerEntry ? sellerEntry.amount : 0;
                let qtyD = 0; let qtyB = 0;
                const prodDetails = window.productDetailsMap[m.month] || [];
                const pEntry = prodDetails.find(d => d.seller_name.toLowerCase() === sellerName.toLowerCase());
                if (pEntry && pEntry.products) {
                    pEntry.products.forEach(p => {
                        if (p.name.toLowerCase().includes('briga')) qtyB += p.quantity;
                        else qtyD += p.quantity;
                    });
                }
                const [yyyy, mm] = m.month.split('-');
                chartData.push({ formatted: shortMonths[parseInt(mm, 10)-1], revenue: rev, desserts: qtyD, brigs: qtyB });
                if (rev > maxRev) maxRev = rev;
            });
            if (maxRev === 0) maxRev = 1;
            const barsHtml = chartData.map(d => {
                const heightPct = Math.max(2, Math.round((d.revenue / maxRev) * 100));
                let revStr = d.revenue >= 1000000 ? "$" + (d.revenue / 1000000).toFixed(1) + "M" : d.revenue >= 1000 ? "$" + Math.round(d.revenue / 1000) + "k" : "";
                return `<div style="display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; width:38px; flex-shrink:0;">
                    <div style="font-size:0.55rem; color:#4f46e5; font-weight:800; margin-bottom:2px;">${revStr}</div>
                    <div style="width:100%; height:${heightPct}%; background:linear-gradient(180deg, #6366f1, #4f46e5); border-radius:6px 6px 0 0;"></div>
                    <div style="height:40px; display:flex; flex-direction:column; align-items:center; border-top:1px solid #e2e8f0; margin-top:2px; padding-top:4px;">
                        <span style="font-size:0.65rem; font-weight:700; color:#64748b;">${d.formatted}</span>
                        <span style="font-size:0.55rem; color:#334155;">🍰${d.desserts}</span>
                    </div>
                </div>`;
            }).join('');

            const md = partnerMeta.metrics_debug || {};
            const fmtP = n => ((n || 0) * 100).toFixed(2);
            const totalDesserts = targetData.partners.reduce((sum, p) => sum + (p.metrics_debug?.desserts || 0), 0);
            
            const netToShare = targetData.net_to_share || 0;
            const meritPool = targetData.merit_pool || 0;
            const adjustmentRatio = netToShare > 0 ? meritPool / netToShare : 1;
            
            const model = (DATA.settings && DATA.settings.partner_distribution_model) || 'pro';
            let meritBase = 0;
            let stepsHtml = '';

            if (model === 'triple') {
                const p1 = md.M || 0;
                const p2 = md.P || 0;
                const p3 = md.H_global || 0;
                meritBase = (p1 * 0.3333) + (p2 * 0.3333) + (p3 * 0.3334);
                
                stepsHtml = `
                    <div style="background:white; padding:14px; border-radius:16px; border:1px solid #e2e8f0; display:flex; flex-direction:column; gap:4px;">
                        <div style="color:#6366f1; font-weight:900; font-size:0.7rem;">PASO 1: ESFUERZO MES ACTUAL (33.33%)</div>
                        <div style="background:#f5f3ff; padding:8px; border-radius:10px; font-family:monospace; color:#4338ca; font-size:0.85rem;">Socio (${md.desserts || 0}) / Empresa (${totalDesserts}) = <b>${fmtP(p1)}%</b></div>
                    </div>
                    <div style="background:white; padding:14px; border-radius:16px; border:1px solid #e2e8f0; display:flex; flex-direction:column; gap:4px;">
                        <div style="color:#6366f1; font-weight:900; font-size:0.7rem;">PASO 2: ESTABILIDAD (6 MESES) (33.33%)</div>
                        <div style="background:#f5f3ff; padding:8px; border-radius:10px; font-family:monospace; color:#4338ca; font-size:0.85rem;">Promedio ult. 6 meses = <b>${fmtP(p2)}%</b></div>
                    </div>
                    <div style="background:white; padding:14px; border-radius:16px; border:1px solid #e2e8f0; display:flex; flex-direction:column; gap:4px;">
                        <div style="color:#6366f1; font-weight:900; font-size:0.7rem;">PASO 3: APORTE HISTÓRICO GLOBAL (33.34%)</div>
                        <div style="background:#f5f3ff; padding:8px; border-radius:10px; font-family:monospace; color:#4338ca; font-size:0.85rem;">Participación de por vida = <b>${fmtP(p3)}%</b></div>
                    </div>
                    <div style="background:#f8fafc; padding:12px; border-radius:16px; border:1px solid #cbd5e1; font-weight:800; text-align:center;">
                        BASE DE MÉRITO (Promedio Triple): <b>${(meritBase * 100).toFixed(2)}%</b>
                    </div>
                `;
                meritBase = meritBase * 100;
            } else {
                const oldH = ((md.H || 0) * 2) - (md.P || 0);
                meritBase = (Number(fmtP(md.M)) + Number(fmtP(md.H))) / 2;
                stepsHtml = `
                    <div style="background:white; padding:14px; border-radius:16px; border:1px solid #e2e8f0; display:flex; flex-direction:column; gap:4px;">
                        <div style="color:#6366f1; font-weight:900; font-size:0.7rem;">PASO 1: MES ACTUAL</div>
                        <div style="background:#f5f3ff; padding:8px; border-radius:10px; font-family:monospace; color:#4338ca; font-size:0.85rem;">Socio (${md.desserts || 0}) / Empresa (${totalDesserts}) = <b>${fmtP(md.M)}%</b></div>
                    </div>
                    <div style="background:white; padding:14px; border-radius:16px; border:1px solid #e2e8f0; display:flex; flex-direction:column; gap:4px;">
                        <div style="color:#6366f1; font-weight:900; font-size:0.7rem;">PASO 2: HISTORIAL CONSOLIDADO</div>
                        <div style="background:#f5f3ff; padding:8px; border-radius:10px; font-family:monospace; color:#4338ca; font-size:0.75rem; line-height:1.4;">
                            <div>1. Promedio (P): (${(md.rolling_M || []).map(v => fmtP(v) + '%').join(' + ')}) / ${md.rolling_M?.length || 1} = <b>${fmtP(md.P)}%</b></div>
                            <div style="margin-top:4px;">2. Inercia Mes Anterior: <b>${fmtP(oldH)}%</b></div>
                            <div style="margin-top:4px; border-top:1px solid #c7d2fe; padding-top:4px;">→ (P + Inercia) / 2 = <b>${fmtP(md.H)}%</b></div>
                        </div>
                    </div>
                    <div style="background:white; padding:14px; border-radius:16px; border:1px solid #e2e8f0; display:flex; flex-direction:column; gap:4px;">
                        <div style="color:#6366f1; font-weight:900; font-size:0.7rem;">PASO 3: BASE DE MÉRITO</div>
                        <div style="background:#f5f3ff; padding:8px; border-radius:10px; font-family:monospace; color:#4338ca; font-size:0.85rem;">(Actual [${fmtP(md.M)}%] + Historial [${fmtP(md.H)}%]) / 2 = <b>${meritBase.toFixed(2)}%</b></div>
                    </div>
                `;
            }

            const meritPartFinal = meritBase * adjustmentRatio;
            const founderPart = partnerMeta.founder_fixed_perc || 0;

            const pop = document.createElement('div');
            pop.className = 'popover-wrap';
            pop.innerHTML = `<div style="background:#fff; padding:32px; border-radius:32px; width:95vw; max-width:1100px; max-height:90vh; overflow-y:auto; display:flex; flex-direction:column; gap:24px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div><h2 style="margin:0; font-size:1.8rem;">Reporte: ${sellerName}</h2></div>
                    <button onclick="closePopover(this)" style="width:40px; height:40px; border-radius:12px; border:none; background:#f1f5f9; cursor:pointer;">✕</button>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 480px; gap:32px;">
                    <div style="display:flex; flex-direction:column; gap:20px;">
                        <div style="background:#fff; border:1px solid #e2e8f0; border-radius:24px; padding:24px; height:400px; display:flex; flex-direction:column;">
                            <h3 style="margin:0 0 20px 0; font-size:1rem;">📈 Tendencia de Ventas</h3>
                            <div style="flex:1; display:flex; align-items:flex-end; gap:8px; overflow-x:auto; padding-bottom:10px;">${barsHtml}</div>
                        </div>
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
                            <div style="background:#f0f9ff; padding:20px; border-radius:20px;"><div style="font-size:0.7rem; font-weight:800;">TOTAL POSTRES MES</div><div style="font-size:1.5rem; font-weight:900;">🍰 ${md.desserts || 0}</div></div>
                            <div style="background:#f5f3ff; padding:20px; border-radius:20px;"><div style="font-size:0.7rem; font-weight:800;">PARTICIPACIÓN FINAL</div><div style="font-size:1.5rem; font-weight:900;">${partnerMeta.share_perc}%</div></div>
                        </div>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:16px; background:#f8fafc; border-radius:24px; padding:24px; border:1px solid #e2e8f0;">
                        <h3 style="margin:0 0 8px 0; font-size:1.1rem;">¿Cómo calculamos tu ${partnerMeta.share_perc}%?</h3>
                        
                        ${stepsHtml}

                        <div style="background:#4f46e5; padding:16px; border-radius:20px; color:white; display:flex; flex-direction:column; gap:4px;">
                            <div style="font-weight:900; font-size:0.7rem; letter-spacing:0.05em; opacity:0.8;">PASO FINAL: PARTICIPACIÓN AJUSTADA</div>
                            <div style="background:rgba(255,255,255,0.1); padding:10px; border-radius:12px; font-family:monospace; font-size:0.85rem; margin-top:4px; line-height:1.4;">
                                <div>1. Parte Mérito (${(adjustmentRatio * 100).toFixed(1)}% bolsa): <b>${meritPartFinal.toFixed(2)}%</b></div>
                                ${founderPart > 0 ? `<div style="margin-top:4px;">2. Parte Fija (Fundadora): <b>${founderPart}%</b></div>` : ''}
                                <div style="margin-top:8px; font-size:1.2rem; background:rgba(0,0,0,0.2); padding:8px; border-radius:8px;">
                                    TOTAL: ${meritPartFinal.toFixed(2)}% ${founderPart > 0 ? '+ ' + founderPart + '%' : ''} = <b style="font-size:1.4rem;">${partnerMeta.share_perc}%</b>
                                </div>
                            </div>
                        </div>

                        <div style="margin-top:auto; padding-top:12px; border-top:2px dashed #cbd5e1; text-align:center;">
                            <div style="font-size:0.8rem; opacity:0.7; font-weight:700;">UTILIDAD A RECIBIR</div>
                            <div style="font-size:2rem; font-weight:900; color:#4f46e5;">${fmt.format(partnerMeta.share_amount)}</div>
                        </div>
                    </div>
                </div>
                <button onclick="closePopover(this)" style="width:100%; padding:18px; border-radius:16px; border:none; background:#0f172a; color:white; font-weight:700; cursor:pointer;">Cerrar Reporte</button>
            </div>`;
            document.body.appendChild(pop);
        };

        async function start() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('auth') === 'admin' || localStorage.getItem('partner_auth') === 'admin') {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                loadData();
            }
        }

        document.getElementById('login-btn').onclick = () => {
            const val = document.getElementById('pass-input').value;
            if (val === 'admin') {
                localStorage.setItem('partner_auth', 'admin');
                location.href = '?auth=admin';
            } else { alert('Clave incorrecta'); }
        };

        async function loadData() {
            try {
                updateStatus('Conectando...');
                const rS = await fetch('/api/sellers');
                if (!rS.ok) throw new Error('Error cargando vendedores');
                SELLERS = await rS.json();
                
                updateStatus('Analizando finanzas...');
                const sync = new URLSearchParams(window.location.search).get('force_sync') === '1' ? '?force_sync=1' : '';
                const rR = await fetch('/api/partners-report' + sync);
                if (!rR.ok) {
                    const errData = await rR.json().catch(() => ({}));
                    throw new Error(errData.details || errData.error || 'Error desconocido en el servidor');
                }
                DATA = await rR.json();
                console.log("DATA loaded:", DATA);
                render();
            } catch (e) {
                console.error("LoadData Error:", e);
                document.getElementById('status-msg').innerHTML = `<div style="color:red; padding:20px; background:#fff; border-radius:16px;"><h3>❌ Error de Sistema</h3><p style="font-size:0.9rem; color:#666;">${e.message}</p><button onclick="location.reload()" style="margin-top:10px; padding:8px 16px; border-radius:8px; border:none; background:#4f46e5; color:white; cursor:pointer;">Reintentar</button></div>`;
            }
        }

        window.toggleEditHistoric = (month, btn) => {
            const isEditing = btn.innerText.includes('Guardar');
            if (!isEditing) {
                document.querySelectorAll(`.hist-text-${month}`).forEach(el => el.style.display = 'none');
                document.querySelectorAll(`.hist-input-${month}`).forEach(el => el.style.display = 'inline-block');
                document.querySelectorAll(`.hist-g-input-${month}`).forEach(el => el.style.display = 'inline-block');
                document.querySelectorAll(`.hist-c-input-${month}`).forEach(el => el.style.display = 'inline-block');
                btn.innerHTML = '💾 Guardar Historico';
                btn.style.background = '#8b5cf6'; btn.style.color = '#fff';
            } else {
                // ... logic to build payload ...
                location.href = '?auth=admin&force_sync=1';
            }
        };

        window.downloadCard = (btn, month) => {
            const card = btn.closest('.box');
            html2canvas(card, { scale: 2, backgroundColor: '#f8fafc', logging: false, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Cierre_${month}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        };

        function render() {
            try {
                document.getElementById('status-msg').style.display = 'none';
                document.getElementById('report-content').style.display = 'block';
                document.getElementById('cfg-btn').style.display = 'flex';
                const cont = document.getElementById('report-content');
                cont.innerHTML = '';
                
                if (!DATA || !DATA.history || DATA.history.length === 0) {
                    cont.innerHTML = '<div style="text-align:center; padding:40px; color:#64748b;">No hay datos históricos disponibles.</div>';
                    return;
                }

                let totalR = 0, totalP = 0;
                window.productDetailsMap = {}; window.revenueDetailsMap = {}; window.expenseDetailsMap = {};
                
                DATA.history.forEach(m => {
                    window.productDetailsMap[m.month] = m.product_detail || [];
                    window.revenueDetailsMap[m.month] = m.revenue_detail || [];
                    window.expenseDetailsMap[m.month] = m.expense_detail || [];
                    totalR += (m.revenue || 0); totalP += (m.profit || 0);
                    
                    const [y, mm] = m.month.split('-');
                    const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
                    const monthLabel = `${monthNames[parseInt(mm)-1] || mm} ${y}`;

                    const div = document.createElement('div');
                    div.className = 'box';
                    div.innerHTML = `
                        <div class="flex" style="margin-bottom: 24px">
                            <div style="display:flex; align-items:center; gap:12px">
                                <div style="width:48px; height:48px; background:#f1f5f9; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:1.5rem">📅</div>
                                <div>
                                    <strong style="font-size:1.4rem;">${monthLabel}</strong>
                                    <span class="pill">Cierre Mensual</span>
                                    <button onclick="toggleEditHistoric('${m.month}', this)" style="margin-left:8px; background:#fff; border:1px solid #cbd5e1; padding:2px 10px; border-radius:12px; font-size:0.75rem; cursor:pointer;">✏️ Modificar</button>
                                    <button onclick="downloadCard(this, '${m.month}')" style="margin-left:4px; background:#fff; border:1px solid #cbd5e1; padding:2px 10px; border-radius:12px; font-size:0.75rem; cursor:pointer;">📸 Foto</button>
                                </div>
                            </div>
                            <div style="text-align:right">
                                <div style="font-size:0.75rem; color:var(--txt-mute); font-weight:700">Utilidad Neta</div>
                                <span style="color:#10b981; font-size:1.6rem; font-weight:900;">${fmt.format(m.profit || 0)}</span>
                            </div>
                        </div>
                        <div class="grid">
                            <div style="display:flex; flex-direction:column; gap:4px">
                                <div style="padding:10px 16px; background:#f5f3ff; border-radius:12px; border:1px solid #ddd6fe; font-size:0.85rem; font-weight:800; color:#4c1d95; display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                                    <span>🍰 ${m.total_desserts || 0} Postres</span>
                                    <span>🍬 ${m.total_brigs || 0} Brigs</span>
                                </div>
                                <div class="fin-item" onclick="showRevenueDetails('${m.month}', event)" style="cursor:pointer;"><span class="fin-label" style="text-decoration:underline; text-decoration-style:dashed;">Ventas (Ingresos)</span><span class="fin-val"><span class="hist-text-${m.month}">${fmt.format(m.revenue || 0)}</span><input type="number" class="hist-g-input-${m.month}" data-key="revenue" value="${m.revenue}" style="display:none; width:80px; text-align:right;"></span></div>
                                <div class="fin-item" onclick="showProductDetails('${m.month}', event)" style="cursor:pointer;"><span class="fin-label" style="text-decoration:underline; text-decoration-style:dashed;">Costo Materia Prima</span><span class="fin-val neg"><span class="hist-text-${m.month}">-${fmt.format(m.cogs || 0)}</span><input type="number" class="hist-g-input-${m.month}" data-key="cogs" value="${m.cogs}" style="display:none; width:80px; text-align:right;"></span></div>
                                <div class="fin-item"><span class="fin-label">Mano de Obra (MOD)</span><span class="fin-val neg"><span class="hist-text-${m.month}">-${fmt.format(m.mod || 0)}</span><input type="number" class="hist-g-input-${m.month}" data-key="mod" value="${m.mod||0}" style="display:none; width:80px; text-align:right;"></span></div>
                                <div class="fin-item" onclick="showExpenseDetails('${m.month}', event)" style="cursor:pointer;"><span class="fin-label" style="text-decoration:underline; text-decoration-style:dashed;">Gastos</span><span class="fin-val neg"><span class="hist-text-${m.month}">-${fmt.format(m.expenses || 0)}</span><input type="number" class="hist-g-input-${m.month}" data-key="expenses" value="${m.expenses}" style="display:none; width:80px; text-align:right;"></span></div>
                                <div class="fin-item"><span class="fin-label">Ajustes</span><span class="fin-val neg"><span class="hist-text-${m.month}">-${fmt.format(m.losses || 0)}</span><input type="number" class="hist-g-input-${m.month}" data-key="losses" value="${m.losses}" style="display:none; width:80px; text-align:right;"></span></div>
                                <div style="margin-top:12px; padding:16px; background:#f5f3ff; border-radius:18px; border:1px solid #ddd6fe">
                                    <div class="flex" style="margin-bottom:8px">
                                        <span style="font-weight:700; color:#5b21b6; font-size:0.85rem;">Comisiones de Venta</span>
                                        <span style="font-weight:900; color:#4c1d95">${fmt.format(m.commissions || 0)}</span>
                                    </div>
                                    <div style="font-size:0.75rem; color:#6d28d9; line-height:1.6">
                                        ${(m.commission_detail || []).sort((a,b)=>b.total_comm - a.total_comm).map(c => `
                                            <div style="display:flex; justify-content:space-between; opacity:0.8; margin-bottom:4px; align-items:center">
                                                <span>• ${c.seller_name} (${c.desserts} P / ${c.brigs} B)</span>
                                                <strong>${fmt.format(c.total_comm)}</strong>
                                            </div>`).join('')}
                                    </div>
                                </div>
                            </div>
                            <div style="background:#f8fafc; padding:24px; border-radius:24px; border:1px solid #f1f5f9; display:flex; flex-direction:column; gap:16px">
                            <div class="flex" style="align-items:baseline">
                                <h4 style="margin:0; font-size:0.8rem; color:var(--txt-mute);">Participación de Socios</h4>
                                <span style="font-size:0.65rem; font-weight:700; color:#64748b;">Total Global: ${m.total_cumulative_desserts || '?'}</span>
                            </div>
                                ${(m.partners || []).sort((a,b)=>b.share_amount - a.share_amount).map(p => `
                                    <div onclick="showSellerHistoryChart('${p.name}', '${m.month}', event)" style="background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:16px; cursor:pointer;">
                                        <div class="flex">
                                            <div><div style="font-weight:800; font-size:1.05rem;">${p.name}</div><div style="font-size:0.75rem; color:#64748b;">🍰 ${p.metrics_debug?.cumulative_total || 0} postres históricos</div></div>
                                            <div style="text-align:right;"><div style="font-size:0.65rem; color:#94a3b8;">Utilidad</div><div style="font-weight:900; font-size:1.2rem; color:#10b981;">${fmt.format(p.share_amount)}</div></div>
                                        </div>
                                        <div style="display:flex; align-items:center; gap:12px; margin-top:8px;"><div style="flex:1; height:8px; background:#f1f5f9; border-radius:8px; overflow:hidden;"><div style="width:${p.share_perc}%; height:100%; background:linear-gradient(90deg, #8b5cf6, #c084fc);"></div></div><strong style="color:#7c3aed; font-size:0.85rem;">${p.share_perc}%</strong></div>
                                    </div>`).join('')}
                            </div>
                        </div>`;
                    cont.appendChild(div);
                });
                document.getElementById('stat-rev').innerText = fmt.format(totalR);
                document.getElementById('stat-prof').innerText = fmt.format(totalP);
            } catch (err) {
                console.error("Render Error:", err);
                document.getElementById('report-content').innerHTML = `<div style="color:red; padding:20px; text-align:center;">Error en el renderizado: ${err.message}</div>`;
            }
        }

        document.getElementById('cfg-btn').onclick = () => {
            try {
                console.log("Opening config modal...");
                const list = document.getElementById('cfg-sellers');
                if (!list) throw new Error("DOM element 'cfg-sellers' not found");
                list.innerHTML = '';
                
                const pIds = (DATA?.settings?.partner_seller_ids || []).map(Number);
                SELLERS.forEach(s => {
                    const isP = pIds.includes(Number(s.id));
                    const d = document.createElement('div');
                    d.style = "padding:10px; border-bottom:1px solid #eee; display:flex; gap:10px; align-items:center";
                    d.innerHTML = `<input type="checkbox" class="is-p" data-id="${s.id}" ${isP ? 'checked' : ''}>
                        <span style="flex:1; font-size:0.9rem;">${s.name}</span>
                        <select class="lead-s" data-id="${s.id}" style="padding:4px; border-radius:6px; font-size:0.8rem;">
                            <option value="">(Sin Líder)</option>
                            ${SELLERS.map(p => `<option value="${p.id}" ${Number(s.parent_id) === Number(p.id) ? 'selected' : ''}>${p.name}</option>`).join('')}
                        </select>`;
                    list.appendChild(d);
                });

                const dModel = (DATA.settings && DATA.settings.partner_distribution_model) || 'pro';
                const distSelect = document.getElementById('dist-model');
                if (distSelect) distSelect.value = dModel;
                
                const fList = document.getElementById('founder-config-list');
                if (fList) {
                    fList.innerHTML = '';
                    const founders = JSON.parse((DATA.settings && DATA.settings.partner_founders) || '{}');
                    pIds.forEach(pid => {
                        const s = SELLERS.find(se => Number(se.id) === Number(pid));
                        const d = document.createElement('div');
                        d.style = "display:flex; justify-content:space-between; align-items:center; gap:10px;";
                        d.innerHTML = `<span style="font-size:0.8rem; font-weight:600;">${s ? s.name : 'Socio ' + pid}</span><input type="number" class="founder-perc" data-id="${pid}" value="${founders[pid] || 0}" style="width:60px; padding:4px; border-radius:6px; border:1px solid #ddd; text-align:right;">%`;
                        fList.appendChild(d);
                    });
                }
                
                document.getElementById('modal-cfg').style.display = 'flex';
            } catch (err) {
                console.error("Config Modal Error:", err);
                alert("Error al abrir configuración: " + err.message);
            }
        };

        document.getElementById('save-cfg').onclick = async () => {
            const btn = document.getElementById('save-cfg');
            btn.disabled = true; btn.innerText = 'Guardando...';
            try {
                const pIds = Array.from(document.querySelectorAll('.is-p:checked')).map(c => Number(c.dataset.id));
                const distModel = document.getElementById('dist-model').value;
                const founders = {};
                document.querySelectorAll('.founder-perc').forEach(inp => {
                    const val = Number(inp.value);
                    if (val > 0) founders[inp.dataset.id] = val;
                });
                
                await fetch('/api/store-settings', { 
                    method: 'POST', 
                    headers: {'Content-Type':'application/json'}, 
                    body: JSON.stringify({ 
                        partner_seller_ids: JSON.stringify(pIds),
                        partner_distribution_model: distModel,
                        partner_founders: JSON.stringify(founders)
                    }) 
                });
                location.href = '?auth=admin&force_sync=1';
            } catch (e) { alert(e.message); btn.disabled = false; btn.innerText = 'Guardar'; }
        };

        start();
    </script>
</body>
</html>

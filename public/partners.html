<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socios | Sweet Lab</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        :root {
            --partner-primary: #4f46e5;
            --partner-bg: #f8fafc;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        body { background-color: var(--partner-bg); color: #1e293b; }
        .partners-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .header-premium {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white; padding: 40px; border-radius: 24px; margin-bottom: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); position: relative;
        }
        .header-premium h1 { font-size: 2.5rem; margin: 0; font-weight: 800; }
        .header-premium p { opacity: 0.9; font-size: 1.1rem; margin-top: 10px; }
        
        .btn-settings-fixed {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            background: #4f46e5; color: white; width: 45px; height: 45px;
            border-radius: 12px; cursor: pointer; border: none;
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .stat-card { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); padding: 20px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.2); }
        .stat-card .label { font-size: 0.85rem; opacity: 0.8; }
        .stat-card .value { font-size: 1.5rem; font-weight: 700; margin-top: 5px; }

        .month-card { background: white; border-radius: 20px; padding: 30px; margin-bottom: 25px; box-shadow: var(--card-shadow); border: 1px solid #e2e8f0; }
        .month-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 20px; }
        .month-title { font-size: 1.5rem; font-weight: 700; color: #0f172a; }
        .month-utility { font-size: 1.25rem; font-weight: 800; color: #10b981; background: #ecfdf5; padding: 8px 16px; border-radius: 12px; }
        .month-utility.negative { color: #ef4444; background: #fef2f2; }

        .financial-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        @media (max-width: 768px) { .financial-grid { grid-template-columns: 1fr; } }

        .breakdown-list { list-style: none; padding: 0; margin: 0; }
        .breakdown-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.95rem; }
        .breakdown-item:last-child { border-bottom: none; font-weight: 700; padding-top: 12px; }

        .partner-shares { background: #f8fafc; padding: 20px; border-radius: 16px; }
        .partner-share-item { margin-bottom: 15px; }
        .partner-info { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.9rem; }
        .partner-info .name { font-weight: 600; }
        .partner-info .percent { color: var(--partner-primary); font-weight: 700; }
        .progress-bar-bg { height: 10px; background: #e2e8f0; border-radius: 5px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--partner-primary); border-radius: 5px; transition: width 0.5s ease; }
        .partner-amount { text-align: right; font-weight: 700; color: #334155; margin-top: 4px; }

        .btn-action { padding: 8px 16px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: 1px solid #cbd5e1; background: white; margin-top: 15px; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 95%; max-width: 550px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); max-height: 90vh; overflow-y: auto; }
        .modal-header { margin-bottom: 20px; font-weight: 700; font-size: 1.3rem; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        
        .config-row { display: grid; grid-template-columns: 30px 140px 140px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.85rem; }
        .config-row.header { font-weight: 700; opacity: 0.7; }
        
        .input-mini { padding: 4px 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.8rem; width: 100%; }
        
        #back-btn { background: transparent; border: 1px solid white; color: white; padding: 6px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; display: inline-block; }
    </style>
</head>
<body>
    <button class="btn-settings-fixed" id="settings-trigger" title="Configuración">⚙️</button>

    <div class="partners-container">
        <button id="back-btn" onclick="location.href='/'">← Volver al inicio</button>
        
        <header class="header-premium">
            <h1>Reporte de Socios</h1>
            <p id="global-subtitle">Resumen ejecutivo y reparto por mérito histório</p>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="label">Ventas Totales Historicas</div>
                    <div class="value" id="total-revenue-value">$ 0</div>
                </div>
                <div class="stat-card">
                    <div class="label">Utilidad Neta Acumulada</div>
                    <div class="value" id="total-profit-value">$ 0</div>
                </div>
                <div class="stat-card">
                    <div class="label">Vendedores Activos</div>
                    <div class="value" id="active-sellers-count">0</div>
                </div>
            </div>
        </header>

        <div id="history-list">
            <div class="month-card" style="text-align:center; padding: 50px;">Cargando reporte financiero...</div>
        </div>
    </div>

    <!-- Modal Configuración -->
    <div id="modal-settings" class="modal">
        <div class="modal-content">
            <div class="modal-header">Gestión de Socios y Líderes</div>
            
            <div style="margin-bottom: 15px;">
                <label style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-weight: 600;">Provisión Default (%)</span>
                    <input type="number" id="default-provision-input" class="input-mini" style="width: 60px" value="3">
                </label>
            </div>

            <div class="config-row header">
                <div></div>
                <div>Nombre</div>
                <div>¿Es Socio?</div>
                <div>Socio Líder (Padrino)</div>
            </div>
            
            <div id="seller-list-config" style="margin-bottom: 20px;">
                <!-- Cargado dinámicamente -->
            </div>

            <div style="display: flex; gap: 10px; position: sticky; bottom: 0; background: white; pt: 10px;">
                <button id="save-settings-btn" class="press-btn btn-primary" style="flex: 1">Guardar Cambios</button>
                <button onclick="closeModals()" class="press-btn secondary">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Modal Ajustes Mensuales -->
    <div id="modal-monthly" class="modal">
        <div class="modal-content">
            <div class="modal-header" id="monthly-modal-title">Registrar Pérdida / Provisión</div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px;">Tipo</label>
                <select id="monthly-kind" class="input-mini" style="width: 100%; height: 35px;">
                    <option value="perdida">⚠️ Pérdida (Mermas/Daños)</option>
                    <option value="provision">💰 Provisión (Reserva Manual)</option>
                </select>
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px;">Descripción</label>
                <input type="text" id="monthly-desc" class="input-mini" style="height: 35px;" placeholder="Ej: Fresa dañada">
            </div>
            <div style="margin-bottom: 25px;">
                <label style="display: block; margin-bottom: 5px;">Monto ($)</label>
                <input type="number" id="monthly-amount" class="input-mini" style="height: 35px;" placeholder="Ej: 50000">
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="save-monthly-btn" class="press-btn btn-primary" style="flex: 1">Registrar</button>
                <button onclick="closeModals()" class="press-btn secondary">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let DATA = null;
        let SELLERS = [];
        let SETTINGS = { partner_seller_ids: [], provision_default_perc: 3 };
        const fmt = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });

        console.log('Partners Interface Loaded');

        async function init() {
            console.log('Initializing data fetch...');
            const auth = new URLSearchParams(window.location.search).get('auth');
            if (auth !== 'admin') {
                const pass = prompt('Acceso Restringido. Digite clave:');
                if (pass !== 'admin') return location.href = '/';
            }

            try {
                const [resp, respSell] = await Promise.all([
                    fetch('/api/partners-report'),
                    fetch('/api/sellers')
                ]);
                
                if (!resp.ok) throw new Error('Error en Reporte: ' + resp.status);
                if (!respSell.ok) throw new Error('Error en Vendedores: ' + respSell.status);

                DATA = await resp.json();
                SELLERS = await respSell.json();
                SETTINGS = DATA.settings;

                console.log('Data loaded:', { historyCount: DATA.history.length, sellersCount: SELLERS.length });
                
                renderHeader();
                renderHistory();
                renderConfigSellers();
            } catch (err) {
                console.error('Initialization error:', err);
                document.getElementById('history-list').innerHTML = `<div class="month-card" style="color:red">Error cargando datos. Revise la consola.</div>`;
            }
        }

        function renderHeader() {
            const totalRev = DATA.history.reduce((a, b) => a + Number(b.revenue || 0), 0);
            const totalProf = DATA.history.reduce((a, b) => a + Number(b.profit || 0), 0);
            document.getElementById('total-revenue-value').textContent = fmt.format(totalRev / 100);
            document.getElementById('total-profit-value').textContent = fmt.format(totalProf / 100);
            document.getElementById('active-sellers-count').textContent = SELLERS.length;
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';

            if (!DATA.history.length) {
                list.innerHTML = '<div class="month-card" style="text-align:center">No hay registros de ventas aún.</div>';
                return;
            }

            DATA.history.forEach(m => {
                const card = document.createElement('div');
                card.className = 'month-card';
                const date = new Date(m.month + '-02');
                const monthName = date.toLocaleDateString('es-CO', { month: 'long', year: 'numeric' });

                card.innerHTML = `
                    <div class="month-header">
                        <div class="month-title">${monthName.toUpperCase()}</div>
                        <div class="month-utility ${m.profit < 0 ? 'negative' : ''}">
                            Utilidad: ${fmt.format(m.profit / 100)}
                        </div>
                    </div>
                    
                    <div class="financial-grid">
                        <div class="breakdown">
                            <ul class="breakdown-list">
                                <li class="breakdown-item"><span>Ingresos Brutos</span> <span>${fmt.format(m.revenue / 100)}</span></li>
                                <li class="breakdown-item"><span>Costo Producción (Invent.)</span> <span>-${fmt.format(m.cogs / 100)}</span></li>
                                <li class="breakdown-item"><span>Gastos Operativos</span> <span>-${fmt.format(m.expenses / 100)}</span></li>
                                <li class="breakdown-item"><span>Comisiones Vendedores</span> <span>-${fmt.format(m.commissions / 100)}</span></li>
                                <li class="breakdown-item" style="color:#ef4444"><span>Pérdidas/Mermas</span> <span>-${fmt.format(m.losses / 100)}</span></li>
                                <li class="breakdown-item" style="color:#4f46e5; border-top: 1px solid #ddd; margin-top: 5px;"><span>Provisión (${m.provision > 0 ? 'Reserva' : 'Default'})</span> <span>-${fmt.format(m.provision / 100)}</span></li>
                                <li class="breakdown-item"><span>Neto a Repartir</span> <span>${fmt.format(m.net_to_share / 100)}</span></li>
                            </ul>
                            <button class="btn-action" onclick="openMonthlyAdjust('${m.month}')">+ Registrar Ajuste</button>
                        </div>
                        
                        <div class="partner-shares">
                            <h4 style="margin-bottom: 15px; opacity:0.7; font-size:0.8rem">REPARTO POR MÉRITO ACUMULADO</h4>
                            ${m.partners.length ? m.partners.map(p => `
                                <div class="partner-share-item">
                                    <div class="partner-info">
                                        <span class="name">${p.name}</span>
                                        <span class="percent">${p.share_perc}%</span>
                                    </div>
                                    <div class="progress-bar-bg">
                                        <div class="progress-bar-fill" style="width: ${p.share_perc}%"></div>
                                    </div>
                                    <div class="partner-amount">${fmt.format(p.share_amount / 100)}</div>
                                </div>
                            `).join('') : '<p style="text-align:center; opacity:0.3; margin-top:20px;">Configure socios en ⚙️</p>'}
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function renderConfigSellers() {
            console.log('Rendering config modal...');
            const container = document.getElementById('seller-list-config');
            if (!container) return;
            container.innerHTML = '';
            
            const partnerIds = Array.isArray(SETTINGS.partner_seller_ids) ? SETTINGS.partner_seller_ids.map(Number) : [];
            console.log('Active Partner IDs:', partnerIds);

            // Only partners can be leaders
            const potentialLeaders = SELLERS.filter(s => partnerIds.includes(Number(s.id)));

            SELLERS.forEach(s => {
                const isPartner = partnerIds.includes(Number(s.id));
                const row = document.createElement('div');
                row.className = 'config-row';
                
                let leadersOptions = `<option value="">(Ninguno)</option>`;
                potentialLeaders.forEach(l => {
                    if (Number(l.id) === Number(s.id)) return;
                    leadersOptions += `<option value="${l.id}" ${Number(s.parent_id) === Number(l.id) ? 'selected' : ''}>${l.name}</option>`;
                });

                row.innerHTML = `
                    <div>👤</div>
                    <div style="font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.name}</div>
                    <div><input type="checkbox" class="partner-check" data-id="${s.id}" ${isPartner ? 'checked' : ''}></div>
                    <div>
                        <select class="leader-select input-mini" data-id="${s.id}" ${isPartner ? 'disabled' : ''}>
                            ${leadersOptions}
                        </select>
                    </div>
                `;
                container.appendChild(row);
            });

            // Re-render only when checking/unchecking partners to update global leaders list
            container.querySelectorAll('.partner-check').forEach(check => {
                check.onchange = () => {
                    const ids = Array.from(container.querySelectorAll('.partner-check:checked')).map(c => Number(c.dataset.id));
                    SETTINGS.partner_seller_ids = ids;
                    renderConfigSellers();
                };
            });
        }

        document.getElementById('settings-trigger').onclick = () => {
            try {
                renderConfigSellers();
                document.getElementById('modal-settings').classList.add('active');
            } catch (err) {
                console.error('Error opening settings:', err);
                alert('Error al abrir configuración: ' + err.message);
            }
        };

        document.getElementById('save-settings-btn').onclick = async () => {
            const btn = document.getElementById('save-settings-btn');
            btn.disabled = true;

            try {
                // 1. Save Global Settings
                const partnerIds = Array.from(document.querySelectorAll('.partner-check:checked')).map(c => Number(c.dataset.id));
                const provPerc = document.getElementById('default-provision-input').value;
                
                await fetch('/api/store-settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        partner_seller_ids: JSON.stringify(partnerIds),
                        provision_default_perc: provPerc
                    })
                });

                // 2. Save Seller Hierarchies (Team leaders)
                const leaderSelects = document.querySelectorAll('.leader-select');
                for (const select of leaderSelects) {
                    const sellerId = select.dataset.id;
                    const parentId = select.value || null;
                    
                    // Only update if it changed from what's in SELLERS
                    const original = SELLERS.find(s => String(s.id) === String(sellerId));
                    if (String(original?.parent_id || '') !== String(parentId || '')) {
                        await fetch('/api/sellers', {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json', 'X-Actor-Name': 'admin' },
                            body: JSON.stringify({ id: sellerId, parent_id: parentId })
                        });
                    }
                }

                alert('Configuración guardada exitosamente');
                location.reload();
            } catch (err) {
                console.error(err);
                alert('Error al guardar configuración');
                btn.disabled = false;
            }
        };

        // --- Adjustments ---
        let activeMonth = null;
        function openMonthlyAdjust(month) {
            activeMonth = month;
            document.getElementById('monthly-modal-title').textContent = `Ajustar: ${month}`;
            document.getElementById('modal-monthly').classList.add('active');
        }

        document.getElementById('save-monthly-btn').onclick = async () => {
            const kind = document.getElementById('monthly-kind').value;
            const desc = document.getElementById('monthly-desc').value;
            const amount = Number(document.getElementById('monthly-amount').value);
            if (!desc || !amount) return alert('Datos incompletos');

            await fetch('/api/accounting', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Actor-Name': 'admin' },
                body: JSON.stringify({ kind, entry_date: activeMonth + '-01', description: `[${activeMonth}] ${desc}`, amount_cents: Math.round(amount * 100), actor_name: 'admin' })
            });
            location.reload();
        };

        document.getElementById('settings-trigger').onclick = () => {
            document.getElementById('modal-settings').classList.add('active');
        };

        function closeModals() {
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        }

        init();
    </script>
</body>
</html>

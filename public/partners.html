<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socios | Sweet Lab</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        :root { --partner-primary: #4f46e5; --partner-bg: #f8fafc; }
        body { background-color: var(--partner-bg); color: #1e293b; font-family: system-ui, sans-serif; }
        .partners-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .header-premium {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white; padding: 40px; border-radius: 24px; margin-bottom: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); position: relative;
        }
        .header-premium h1 { font-size: 2.5rem; margin: 0; }
        
        .btn-settings-fixed {
            position: fixed; top: 20px; right: 20px; z-index: 2000;
            background: #4f46e5; color: white; width: 50px; height: 50px;
            border-radius: 50%; cursor: pointer; border: none; font-size: 1.5rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .stat-card { background: rgba(255, 255, 255, 0.15); padding: 20px; border-radius: 16px; backdrop-filter: blur(5px); }

        .month-card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .month-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 15px; }

        .financial-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .financial-grid { grid-template-columns: 1fr; } }

        .partner-shares { background: #f8fafc; padding: 15px; border-radius: 12px; }
        .partner-info { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; }
        .progress-bar-bg { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
        .progress-bar-fill { height: 100%; background: var(--partner-primary); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 3000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 90%; max-width: 600px; color: #334155; }
        
        .config-row { display: grid; grid-template-columns: 1fr 100px 150px; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        #seller-list-config { max-height: 400px; overflow-y: auto; margin: 15px 0; }

        .retry-btn { background: #4f46e5; color: white; padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <button class="btn-settings-fixed" id="btn-open-settings">⚙️</button>

    <div class="partners-container">
        <button onclick="location.href='/'" style="background:none; border:1px solid #666; color:#666; padding:5px 15px; border-radius:10px; cursor:pointer; margin-bottom:20px;">Volver</button>
        
        <header class="header-premium">
            <h1>Socios</h1>
            <p>Reporte de Utilidades y Mérito Histórico</p>
            <div class="stats-grid" id="global-stats">
                <div class="stat-card">Ventas: $0</div>
                <div class="stat-card">Utilidad: $0</div>
            </div>
        </header>

        <div id="main-content">
            <p style="text-align:center">Cargando datos...</p>
        </div>
    </div>

    <!-- Modal Config -->
    <div id="modal-settings" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0">Configuración</h2>
            <div style="background:#f1f5f9; padding: 10px; border-radius:10px">
                Provisión Default: <input type="number" id="prov-input" style="width:50px" value="3">%
            </div>
            <div id="seller-list-config"></div>
            <div style="display:flex; gap:10px">
                <button id="btn-save-settings" style="flex:1; background:#4f46e5; color:white; padding:10px; border:none; border-radius:10px; cursor:pointer">Guardar</button>
                <button onclick="closeModals()" style="flex:1; padding:10px; border-radius:10px; cursor:pointer">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let DATA = null;
        let SELLERS = [];
        const fmt = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });

        async function init() {
            const auth = new URLSearchParams(window.location.search).get('auth');
            if (auth !== 'admin') {
                const pass = prompt('Clave administrador:');
                if (pass !== 'admin') return location.href = '/';
            }

            try {
                console.log('Fetching APIs...');
                const [r1, r2] = await Promise.all([
                    fetch('/api/partners-report'),
                    fetch('/api/sellers')
                ]);

                if (!r1.ok || !r2.ok) throw new Error(`API Error: Report=${r1.status}, Sellers=${r2.status}`);

                DATA = await r1.json();
                SELLERS = await r2.json();

                if (!Array.isArray(SELLERS)) SELLERS = [];
                
                renderUI();
            } catch (err) {
                console.error(err);
                document.getElementById('main-content').innerHTML = `
                    <div style="background:#fee2e2; color:#b91c1c; padding:20px; border-radius:15px; text-align:center">
                        <h3>Error de conexión</h3>
                        <p>${err.message}</p>
                        <button class="retry-btn" onclick="location.reload()">Reintentar</button>
                    </div>
                `;
            }
        }

        function renderUI() {
            const list = document.getElementById('main-content');
            list.innerHTML = '';
            
            // History
            DATA.history.forEach(m => {
                const card = document.createElement('div');
                card.className = 'month-card';
                card.innerHTML = `
                    <div class="month-header">
                        <strong style="font-size:1.2rem">${m.month}</strong>
                        <span style="color:#10b981; font-weight:bold">${fmt.format(m.profit / 100)}</span>
                    </div>
                    <div class="financial-grid">
                        <div style="font-size:0.9rem">
                            <div>Ingresos: ${fmt.format(m.revenue / 100)}</div>
                            <div>Costos: -${fmt.format(m.cogs / 100)}</div>
                            <div>Gastos: -${fmt.format(m.expenses / 100)}</div>
                        </div>
                        <div class="partner-shares">
                            ${m.partners.map(p => `
                                <div class="partner-info">
                                    <span>${p.name} (${p.share_perc}%)</span>
                                    <strong>${fmt.format(p.share_amount / 100)}</strong>
                                </div>
                                <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${p.share_perc}%"></div></div>
                            `).join('')}
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function renderConfig() {
            const cont = document.getElementById('seller-list-config');
            cont.innerHTML = '';
            
            const pIds = (DATA.settings.partner_seller_ids || []).map(Number);
            const partners = SELLERS.filter(s => pIds.includes(Number(s.id)));

            SELLERS.forEach(s => {
                const isP = pIds.includes(Number(s.id));
                const row = document.createElement('div');
                row.className = 'config-row';
                row.innerHTML = `
                    <div style="font-weight:bold">${s.name}</div>
                    <div><input type="checkbox" class="is-partner" data-id="${s.id}" ${isP ? 'checked' : ''}> Socio</div>
                    <div>
                        <select class="padrino-select" data-id="${s.id}" ${isP ? 'disabled' : ''}>
                            <option value="">(Sin Líder)</option>
                            ${partners.map(p => `<option value="${p.id}" ${Number(s.parent_id) === Number(p.id) ? 'selected' : ''}>${p.name}</option>`).join('')}
                        </select>
                    </div>
                `;
                cont.appendChild(row);
            });
        }

            // Save Global
            await fetch('/api/store-settings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ partner_seller_ids: JSON.stringify(pIds), provision_default_perc: prov })
            });

            // Save Padrinos
            const selects = document.querySelectorAll('.padrino-select');
            for(const sel of selects) {
                await fetch('/api/sellers', {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json', 'X-Actor-Name': 'admin'},
                    body: JSON.stringify({ id: sel.dataset.id, parent_id: sel.value || null })
                });
            }

            location.reload();
        };

        function closeModals() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }

        init();
    </script>
</body>
</html>
